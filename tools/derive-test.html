<!doctype html>
<meta charset="utf-8">
<title>Imagine RPG derivation test</title>
<style>body{font:13px monospace;padding:1rem}.p{color:#0a0}.f{color:#c00;font-weight:bold}</style>
<pre id="out">running...</pre>
<script type="module">
// Derivation tests for the character data model.
//
// Must be served over HTTP:
//     python -m http.server 8777 --bind 127.0.0.1
//     open http://127.0.0.1:8777/tools/derive-test.html
//
// Foundry is not present here, so the two globals the data model touches at import time are
// stubbed. defineSchema() is never called -- these tests drive the prepare* methods directly
// against a plain data object, which is exactly the arithmetic we care about verifying.
globalThis.foundry = {
	abstract: {
		TypeDataModel: class {
			constructor(data) { Object.assign(this, data); }
			prepareBaseData() {}
			prepareDerivedData() {}
		}
	},
	data: { fields: new Proxy({}, { get: () => class { constructor() {} } }) }
};
// The character model reads the campaign's content rules. Null means everything is available.
globalThis.game = { imagine: { getAvailabilityRules: () => null } };

const { default: ImagineCharacterData } = await import("../module/data/actor-character.mjs");
const R = await import("../module/combat/combat-rules.mjs");
const S = await import("../module/skills-rules.mjs");
const C = await import("../module/class-rules.mjs");

const results = [];
function check(label, actual, expected) {
	const ok = JSON.stringify(actual) === JSON.stringify(expected);
	results.push(`${ok ? "PASS" : "FAIL"}  ${label}\n        expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
	return ok;
}

// Build a character with known attribute ratings.
function makeCharacter(ratings, title = 12, items = [], extra = {}) {
	const attributes = {};
	for (const k of ["str","agl","vit","int","wis","knw","app","chm","soc","aur","pty","wil"]) {
		attributes[k] = { rating: ratings[k] ?? 10, permMod: 0, tempMod: 0 };
	}
	const characteristic = () => ({ titleBonus: 0, raceMod: 0, permMod: 0, tempMod: 0 });
	const resistance = () => ({ misc: 0, immune: false });

	const c = new ImagineCharacterData({
		identity: { title },
		attributes,
		characteristics: {
			endurance: characteristic(), perception: characteristic(),
			affinity: characteristic(), fortune: characteristic()
		},
		resistances: {
			magic: resistance(), illusion: resistance(), control: resistance(),
			poison: resistance(), disease: resistance()
		},
		body: { bodyType: "Humanoid", areas: [], armorDamage: extra.armorDamage ?? {} },
		// The real schema always provides these; the fixture has to supply them too.
		combat: { meleeMisc: 0, missileMisc: 0, damageMisc: 0, defenseMisc: 0, initiativeMisc: 0, skillMisc: 0,
		          weaponLoreList: extra.weaponLoreList ?? "", missileLoreList: extra.missileLoreList ?? "",
		          projectileLoreList: extra.projectileLoreList ?? "" },
		physical: { weight: 0, handedness: extra.handedness ?? "" },
		languages: extra.languages ?? [],
		skillSlotMoves: Object.assign({
			racialToClass: 0, racialToSocial: 0, socialToRacial: 0, socialToClass: 0,
			racialSacrificed: 0, socialSacrificed: 0
		}, extra.skillSlotMoves ?? {}),
		movement: {
			walk: { hourly: 0, tenSec: 0, oneSec: 0 },
			jog:  { hourly: 0, tenSec: 0, oneSec: 0 },
			run:  { hourly: 0, tenSec: 0, oneSec: 0 },
			special: { hourly: 0, tenSec: 0, oneSec: 0 },
			specialName: "", travelHours: 0, restHours: 0, jumpStand: 0, jumpUp: 0
		}
	});
	// stand in for the owning Actor document
	c.parent = { items };
	c.prepareBaseData();
	c.prepareDerivedData();
	return c;
}

// --- attribute saves, against his getAttribSave ---------------------------------
const saves = makeCharacter({ str: 10, agl: 17, vit: 18, int: 19, wis: 20, knw: 23 });
check("STR 10 save",  saves.attributes.str.save, 50);
check("AGL 17 save",  saves.attributes.agl.save, 85);
check("VIT 18 save",  saves.attributes.vit.save, 90);
check("INT 19 save (plateaus at 90)", saves.attributes.int.save, 90);
check("WIS 20 save (plateaus at 90)", saves.attributes.wis.save, 90);
check("KNW 23 save (90 + 3 above 20)", saves.attributes.knw.save, 93);

// --- attribute table lookups ----------------------------------------------------
const c19 = makeCharacter({ str: 19 });
check("STR 19 melee attack", c19.attributes.str.mods.meleeAttack, 2);
check("STR 19 melee damage", c19.attributes.str.mods.meleeDamage, 5);
check("STR 19 load limit",   c19.attributes.str.mods.loadLimit, 1.8);
check("STR 19 weapon speed", c19.attributes.str.mods.weaponSpeed, -2);

// --- the two attribute maximums ---------------------------------------------------
// There are TWO ceilings, which he confirmed 2026-09-16: "25 for normal statistic upgrades, 27
// for magical upgrades." The ordinary maximum comes from the race (20 before one is chosen) and
// is discarded at title 11 for a flat 25. The magical one is tiered by title on its own.
check("no race yet means the 20 default",   ImagineCharacterData.getAttributeMax(0, 0), 20);
check("a race's limit is the maximum",      ImagineCharacterData.getAttributeMax(5, 18), 18);
check("a race may allow more than 20",      ImagineCharacterData.getAttributeMax(5, 28), 28);
check("title 11 discards the racial limit for 25", ImagineCharacterData.getAttributeMax(11, 18), 25);
check("and it stays 25 at title 16",        ImagineCharacterData.getAttributeMax(16, 18), 25);
check("title 10 is still the racial limit", ImagineCharacterData.getAttributeMax(10, 18), 18);

// The magical ceiling, from his setMagicalAttributeMaximums -- the Master's Manual's own
// mundane / mortal / arch-mortal ranges. His function writes nothing above title 15, so the
// arch-mortal figure holds rather than a deity band being invented.
check("title 0 is mundane, 23",          ImagineCharacterData.getMagicalAttributeMax(0), 23);
check("titles 1-10 are mortal, 25",      ImagineCharacterData.getMagicalAttributeMax(1), 25);
check("...still 25 at title 10",         ImagineCharacterData.getMagicalAttributeMax(10), 25);
check("titles 11-15 are arch-mortal, 27", ImagineCharacterData.getMagicalAttributeMax(11), 27);
check("...and 27 holds above 15, since his function stops there",
	ImagineCharacterData.getMagicalAttributeMax(20), 27);
check("the magical ceiling is always at or above the ordinary one",
	[ImagineCharacterData.getMagicalAttributeMax(11) >= ImagineCharacterData.getAttributeMax(11, 18),
	 ImagineCharacterData.getMagicalAttributeMax(5) >= ImagineCharacterData.getAttributeMax(5, 18)],
	[true, true]);

const capped = makeCharacter({ str: 30 }, 1); // no race, so the maximum is the 20 default
check("rating above the maximum is clamped", capped.attributes.str.value, 20);

// --- the Intelligence language allowance, against his setLangSheet ------------------
// His labels for every rating, read out of both copies of his switch (setLangSheet at
// sheet-worker.js:49228 and setUpdateLanguageSheet at 50561, which agree case for case).
// "None" is written here as no slots at all.
const SW = "Speaks/writes:", SP = "Speaks:";
const rep = (n, s) => Array(n).fill(s);
const HIS_LANGUAGE_LABELS = {
	0: [], 1: [], 2: [], 3: [],
	4: ["Speaks(quarter):"], 5: ["Speaks(third):"], 6: ["Speaks(third):"], 7: ["Speaks(two-thirds):"],
	8: [SP], 9: ["Speaks/third writes:"], 10: ["Speaks/third writes:"],
	11: ["Speaks/two-thirds writes:"], 12: ["Speaks/two-thirds writes:"], 13: [SW],
	14: [SW, SP], 15: [SW, SP], 16: [SW, SP, SP], 17: [SW, SW, SP], 18: [SW, SW, SP, SP],
	19: [...rep(3, SW), SP, SP], 20: [...rep(4, SW), SP, SP], 21: [...rep(5, SW), SP, SP],
	22: [...rep(6, SW), SP, SP], 23: [...rep(7, SW), SP, SP], 24: [...rep(8, SW), SP, SP],
	25: [...rep(9, SW), SP], 26: rep(10, SW), 27: rep(10, SW), 28: rep(10, SW), 29: rep(10, SW),
	30: rep(10, SW)
};
// Read straight off the table rather than through a character, since a character with no race
// is capped at 20 and the ratings above it would never be reached.
const { ATTRIBUTE_TABLES } = await import("../module/config-tables.mjs");
const labelMismatches = [];
for (let r = 0; r <= 30; r++) {
	const row = ATTRIBUTE_TABLES.int[r];
	const got = ImagineCharacterData.getLanguageSlotLabels(row.spokenLanguages, row.writtenLanguages);
	if (JSON.stringify(got) !== JSON.stringify(HIS_LANGUAGE_LABELS[r])) { labelMismatches.push(r); }
}
check("slot labels match his switch at every Intelligence 0-30", labelMismatches, []);

const lang3  = makeCharacter({ int: 3 });
check("Intelligence 3 allows no language at all", lang3.languageAllowance.slots, 0);
const lang4  = makeCharacter({ int: 4 });
check("Intelligence 4 is one language, a quarter spoken -- not a quarter of a second one",
	[lang4.languageAllowance.slots, lang4.languageAllowance.labels[0]], [1, "Speaks(quarter):"]);
const lang8  = makeCharacter({ int: 8 });
check("Intelligence 8 speaks one fully and writes nothing",
	[lang8.languageAllowance.slots, lang8.languageAllowance.writtenSlots], [1, 0]);
const lang9  = makeCharacter({ int: 9 });
check("Intelligence 9 is the first to write, a third of the one it speaks",
	[lang9.languageAllowance.writtenSlots, lang9.languageAllowance.labels], [1, ["Speaks/third writes:"]]);
const lang16 = makeCharacter({ int: 16 });
check("Intelligence 16 is three slots, one of which writes",
	[lang16.languageAllowance.slots, lang16.languageAllowance.writtenSlots], [3, 1]);

const within = makeCharacter({ int: 14 }, 12, [], { languages: [
	{ name: "Common", speak: true, write: true }, { name: "Elvish", speak: true, write: false }] });
check("two languages, one written, fit Intelligence 14",
	[within.languageAllowance.used, within.languageAllowance.overSpoken, within.languageAllowance.overWritten],
	[2, false, false]);
const overWrite = makeCharacter({ int: 14 }, 12, [], { languages: [
	{ name: "Common", speak: true, write: true }, { name: "Elvish", speak: true, write: true }] });
check("writing both at Intelligence 14 is flagged -- only one slot writes",
	[overWrite.languageAllowance.overSpoken, overWrite.languageAllowance.overWritten], [false, true]);
const overSpeak = makeCharacter({ int: 14 }, 12, [], { languages: [
	{ name: "Common", speak: true, write: false }, { name: "Elvish", speak: true, write: false },
	{ name: "Dwarvish", speak: true, write: false }] });
check("a third language at Intelligence 14 is flagged, not removed",
	[overSpeak.languageAllowance.overSpoken, overSpeak.languages.length], [true, 3]);
const openSlot = makeCharacter({ int: 14 }, 12, [], { languages: [
	{ name: "Common", speak: true, write: false }, { name: "", speak: true, write: false }] });
check("an empty row is a slot left open, and counts",
	[openSlot.languageAllowance.used, openSlot.languageAllowance.overSpoken], [2, false]);
// Slots are handed out by use, not by position -- "a character can use a written slot for a
// spoken slot, but not vice versa" (Player's Guide, Intelligence).
const A = (langs, labels) => ImagineCharacterData.assignLanguageSlots(langs, labels).map(r =>
	`${r.slotLabel}${r.overSpoken ? " OVER" : ""}${r.overWritten ? " WRITE-OVER" : ""}`);
const L = (w) => ({ name: "x", speak: true, write: w });
check("a written language added second still takes the writing slot",
	A([L(false), L(true)], [SW, SP]), [SP, SW]);
check("a spoken language may use a writing slot nobody wrote in",
	A([L(false), L(false)], [SW, SP]), [SP, SW]);
check("a second written language with one writing slot speaks, but is over on writing",
	A([L(true), L(true)], [SW, SP]), [SW, SP + " WRITE-OVER"]);
check("with every slot taken, the extra language is over",
	A([L(false), L(false), L(false)], [SW, SP]), [SP, SW, " OVER"]);
check("a partly-written slot counts as a writing slot",
	A([L(true)], ["Speaks/third writes:"]), ["Speaks/third writes:"]);
check("the model carries one assignment per language",
	within.languageAllowance.rows.length, 2);

const dropped = makeCharacter({ int: 3 }, 12, [], { languages: [{ name: "Common", speak: true, write: false }] });
check("Intelligence falling below 4 flags a language already held",
	dropped.languageAllowance.overSpoken, true);

// --- characteristics: ceiling of each category's average ------------------------
const ch = makeCharacter({
	str: 19, agl: 18, vit: 18,   // physical  -> ceil(55/3) = 19
	int: 18, wis: 18, knw: 20,   // mental    -> ceil(56/3) = 19
	app: 14, chm: 15, soc: 15,   // personal  -> ceil(44/3) = 15
	aur: 18, pty: 13, wil: 20    // mystical  -> ceil(51/3) = 17
});
check("Endurance base (physical avg)",  ch.characteristics.endurance.base, 19);
check("Perception base (mental avg)",   ch.characteristics.perception.base, 19);
check("Affinity base (personal avg)",   ch.characteristics.affinity.base, 15);
check("Fortune base (mystical avg)",    ch.characteristics.fortune.base, 17);
check("Shock = Endurance x 3",          ch.body.shock, 57);

// exact-integer average must not round up
const exact = makeCharacter({ str: 12, agl: 12, vit: 12 });
check("exact average does not round up", exact.characteristics.endurance.base, 12);

// --- skill chances --------------------------------------------------------------
// The Player's Guide p.94 worked example: Strength 16 + Agility 14 averages to a combined 15;
// against a skill rating of 12 that is (15 - 12) x 5% = +15% base chance.
const skillActor = makeCharacter({ str: 16, agl: 14 }, 5, [
	{ type: "skill", system: { attr1: "STR", attr2: "AGL", skillRating: 12,
	  startingBonus: 7, abilityBonus: 0, misc: 0, isCommon: false, category: "class" } },
	{ type: "skill", system: { attr1: "AGL", attr2: "", skillRating: 16,
	  startingBonus: 0, abilityBonus: 0, misc: 0, isCommon: true, category: "class" } }
]);
const sk1 = skillActor.parent.items[0].system;
const sk2 = skillActor.parent.items[1].system;
check("book example: combined attributes", sk1.combinedAttributes, 15);
check("book example: base chance +15%",    sk1.baseChance, 15);
check("total = base + starting bonus",     sk1.totalChance, 22);
check("single-attribute skill combined",   sk2.combinedAttributes, 14);
check("common skill ignores starting bonus", sk2.totalChance, -10);
check("common skill does not consume a slot", skillActor.skillSlots.classUsed, 1);

// --- resistances ----------------------------------------------------------------
const res = makeCharacter({ aur: 18, wis: 18, vit: 18, wil: 20, int: 18 });
check("magic resist comes from Aura", res.resistances.magic.base, res.attributes.aur.mods.magicResist);
check("poison resist comes from Vitality", res.resistances.poison.base, res.attributes.vit.mods.poisonResist);
const controlExpected = (res.attributes.wil.mods.controlResist || 0)
                      + (res.attributes.int.mods.controlResistAdjust || 0)
                      + (res.attributes.wis.mods.controlResistAdjust || 0);
check("control resist combines WIL + INT + WIS", res.resistances.control.base, controlExpected);

const immune = makeCharacter({ aur: 18 });
immune.resistances.magic.immune = true;
immune.prepareDerivedData();
check("immunity overrides the percentage", immune.resistances.magic.value, null);

// --- race integration -----------------------------------------------------------
// A stand-in race item: +2 STR / -1 AGL, a strict Strength cap of 18, and movement rates.
function makeRace(overrides = {}) {
	return {
		type: "race",
		name: "Testfolk",
		system: {
			attributeMods: { str: 2, agl: -1, vit: 0, int: 0, wis: 0, knw: 0,
			                 app: 0, chm: 0, soc: 0, aur: 0, pty: 0, wil: 0 },
			attributeLimits: { str: 18, agl: 20, vit: 20, int: 20, wis: 20, knw: 20,
			                   app: 20, chm: 20, soc: 20, aur: 20, pty: 20, wil: 20 },
			endurance: { startFormula: "", startMod: 4, titleFormula: "", titleDice: "", titleMax: 0, titleMod: 0 },
			characteristicMods: { perception: 3, affinity: -2, fortune: 1 },
			resistanceMods: { magic: 10, illusion: 0, control: 0, poison: 5, disease: 0 },
			// These are MODIFIERS on the Agility base, not finished rates, so they are the size
			// his data actually carries: this is the Human(Barbaric) row, +1/+10/+1 walking.
			movement: {
				speedMultiplier: 1,
				walk: { hourly: 1, tenSec: 10, oneSec: 1 },
				jog:  { hourly: 2, tenSec: 20, oneSec: 2 },
				run:  { hourly: 2, tenSec: 30, oneSec: 3 },
				specialName: "Fly:",
				special: { hourly: "", hourlyMultiplier: 0, hourlyMod: 0, tenSec: "", tenSecMultiplier: 0,
				           tenSecMod: 0, oneSec: "", oneSecMultiplier: 0, oneSecMod: 0 },
				jumpStand: 2, jumpUp: 0.5
			},
			formless: false, canSwim: true,
			...overrides
		}
	};
}

const raced = makeCharacter({ str: 14, agl: 14, vit: 14, int: 12, wis: 12, knw: 12,
                              app: 12, chm: 12, soc: 12, aur: 12, pty: 12, wil: 12 },
                            12, [makeRace()]);
check("racial attribute modifier is applied", raced.attributes.str.value, 16);   // 14 + 2
check("negative racial modifier is applied",  raced.attributes.agl.value, 13);   // 14 - 1
// Below title 11 the race's limits are the maximums.
const racedLow = makeCharacter({ str: 14, agl: 14, vit: 14, int: 12 }, 5, [makeRace()]);
check("racial limit is the maximum below title 11", racedLow.attributes.str.max, 18);
check("an unrestricted attribute takes the race's own 20", racedLow.attributes.int.max, 20);

// From title 11 they are discarded for a flat 25, upwards as well as downwards.
check("title 11 and up discards the racial limit", raced.attributes.str.max, 25);
// Strength 20 plus the race's +2 is 22. The race's limit of 18 would have clamped that before
// title 11; at 16 the limit is gone and 22 stands, under the flat 25.
const capRace = makeCharacter({ str: 20 }, 16, [makeRace()]); // race limit 18, but arch-mortal
check("a rating the race would have barred now stands", capRace.attributes.str.value, 22);
check("and the maximum is 25, not the book's deity 30", capRace.attributes.str.max, 25);
check("the magical maximum sits beside it on every attribute",
	[capRace.attributes.str.magicalMax, capRace.attributes.wil.magicalMax], [27, 27]);

// Endurance: physical average of the POST-racial values, plus the racial endurance modifier.
// str 14+2=16, agl 14-1=13, vit 14 -> ceil(43/3) = 15, +4 racial = 19
check("Endurance uses post-racial attributes", raced.characteristics.endurance.base, 15);
check("racial endurance modifier is applied",  raced.characteristics.endurance.value, 19);
check("racial characteristic modifier",        raced.characteristics.perception.raceMod, 3);
check("racial resistance modifier is added",
	raced.resistances.magic.value, raced.resistances.magic.base + 10);
// Movement: the Agility base plus the race's MODIFIER, not the race's figure on its own.
// This character's Agility lands on 13 (14 - 1 racial), whose band bases are walk 4/40/4,
// jog 8/80/8, run 12/120/12. The race adds the Human(Barbaric) row on top.
check("walk is the Agility base plus the race's modifier", raced.movement.walk.tenSec, 50);
check("...at the hourly scale too",                        raced.movement.walk.hourly, 5);
check("...and per second",                                 raced.movement.walk.oneSec, 5);
check("jog takes its own base and modifier",               raced.movement.jog.tenSec, 100);
check("run takes its own base and modifier",               raced.movement.run.tenSec, 150);
check("jumping is the same base-plus-modifier shape",      raced.movement.jumpStand, 8);
check("...and so is the upward jump",                      raced.movement.jumpUp, 3);
check("special movement name from the race",   raced.movement.specialName, "Fly:");
check("race name surfaces on identity",        raced.identity.raceName, "Testfolk");

// A race whose every movement figure is 0 has NO MODIFIER, and moves at the full base for its
// Agility. This is the Human(Civilized) case, and the whole point of the table: before this was
// understood the sheet showed such a character as unable to walk at all. If this test ever fails
// by reading 0, the base table has stopped being applied -- do not "fix" it by editing the race.
const zeroMods = {
	attributeMods: { str: 0, agl: 0, vit: 0, int: 0, wis: 0, knw: 0,
	                 app: 0, chm: 0, soc: 0, aur: 0, pty: 0, wil: 0 },
	movement: {
		speedMultiplier: 0,
		walk: { hourly: 0, tenSec: 0, oneSec: 0 },
		jog:  { hourly: 0, tenSec: 0, oneSec: 0 },
		run:  { hourly: 0, tenSec: 0, oneSec: 0 },
		specialName: "", special: {}, jumpStand: 0, jumpUp: 0 } };
const plain = makeCharacter({ agl: 11 }, 12, [makeRace(zeroMods)]);
check("a race with no modifiers still walks",      plain.movement.walk.tenSec, 40);
check("...and jogs",                               plain.movement.jog.tenSec, 70);
check("...and runs",                               plain.movement.run.tenSec, 110);
check("a speed multiplier of 0 means one, not nil", plain.movement.walk.hourly, 4);

// A negative rate is lifted to the book's floor (Player's Guide p.36): 1 mile, 10 feet, 1 foot.
// This is reachable honestly: Dwarf(Civilized) carries -2 / -30 / -3 walking, and at Agility 5 the
// base is only 1 / 10 / 1, so all three go under.
const stumpy = makeCharacter({ agl: 5 }, 12, [makeRace({ ...zeroMods, movement: {
	...zeroMods.movement, walk: { hourly: -2, tenSec: -30, oneSec: -3 } } })]);
check("a negative rate falls to the hourly floor", stumpy.movement.walk.hourly, 1);
check("...the ten second floor",                   stumpy.movement.walk.tenSec, 10);
check("...and the one second floor",               stumpy.movement.walk.oneSec, 1);

// A NEGATIVE speed multiplier is not a coherent quantity and is ignored, not floored. Only
// Elf(Sea) and Elf(Ice) carry one (-10), and it reads as a mis-keyed cell -- they are also the only
// two elves of eleven with no disease-resistance modifier. Flooring them left a sea elf swimming at
// 1 mile an hour; ignoring it lets them move like any other elf.
const negMulti = makeCharacter({ agl: 15 }, 12,
	[makeRace({ ...zeroMods, movement: { ...zeroMods.movement, speedMultiplier: -10 } })]);
check("a negative speed multiplier is ignored",    negMulti.movement.walk.tenSec, 50);
check("...rather than flooring the race",          negMulti.movement.walk.hourly, 5);

// His switch stops at 30 with no default; the port holds the top band rather than leaving
// whatever the last character happened to have. This is tested against the table directly
// because an attribute cannot reach 30 on a character -- title 11 and up caps every rating at 25.
check("Agility past his top band holds that band",
	R.getMovementBase(40).run[1], R.getMovementBase(30).run[1]);
check("a rating below his table takes the bottom band",
	R.getMovementBase(-5).walk[1], R.getMovementBase(0).walk[1]);

// --- special movement -----------------------------------------------------------
// Built on the rates just resolved, so "Walk" means the character's finished walk rate. The five
// kinds do NOT share a formula: only Scurry adds its additive, and Slither alone ignores the
// race's speed multiplier and replaces ordinary movement outright.
const specialRace = (name, spec, extra = {}) => makeRace({
	...zeroMods,
	movement: { ...zeroMods.movement, specialName: name, special: spec, ...extra } });
const walkTimes = (n) => ({ hourly: "Walk", hourlyMultiplier: n, hourlyMod: 0,
                            tenSec: "Walk", tenSecMultiplier: n, tenSecMod: 0,
                            oneSec: "Walk", oneSecMultiplier: n, oneSecMod: 0 });

// Agility 11 with no modifiers: walk 4/40/4, run 12/110/11.
const centaur = makeCharacter({ agl: 11 }, 12, [specialRace("Gallop:", walkTimes(4))]);
check("Gallop is the resolved walk times four",   centaur.movement.special.tenSec, 160);
check("...at the hourly scale",                   centaur.movement.special.hourly, 16);
check("...and per second",                        centaur.movement.special.oneSec, 16);
check("Gallop does not disturb walking",          centaur.movement.walk.tenSec, 40);

// Djinn and Sylph fly from RUN, not walk. A hardcoded base passes every Walk test and fails here.
const djinn = makeCharacter({ agl: 11 }, 12, [specialRace("Fly:",
	{ ...walkTimes(3), hourly: "Run", tenSec: "Run", oneSec: "Run" })]);
check("Fly can be worked from run instead",       djinn.movement.special.tenSec, 330);

// Scurry is the only kind that adds its additive, and Arachen's differs between scales: +4 and +40.
const arachen = makeCharacter({ agl: 11 }, 12, [specialRace("Scurry:",
	{ ...walkTimes(4), hourlyMod: 4, tenSecMod: 40, oneSecMod: 4 })]);
check("Scurry adds its hourly additive",          arachen.movement.special.hourly, 20);
check("...and a different one per ten seconds",   arachen.movement.special.tenSec, 200);

// The same additive on a kind that does not use one must be ignored, not quietly applied.
const gallopMod = makeCharacter({ agl: 11 }, 12, [specialRace("Gallop:",
	{ ...walkTimes(4), hourlyMod: 4, tenSecMod: 40, oneSecMod: 4 })]);
check("Gallop ignores an additive",               gallopMod.movement.special.hourly, 16);

// Slither is the whole of a snake's movement, and they cannot jump.
const seeth = makeCharacter({ agl: 11 }, 12, [specialRace("Slither:", walkTimes(2))]);
check("Slither resolves from walk",               seeth.movement.special.tenSec, 80);
check("...and then walking is gone",              seeth.movement.walk.tenSec, 0);

// --- encumbrance ----------------------------------------------------------------
// STR 11 has a load limit of 1.0, so a 200 lb character maxes out at 200 lb carried.
// Bands fall at a quarter, half, three quarters and the whole of that.
function gear(weight, location = "carried", extra = {}) {
	return { type: "equipment", name: "thing",
	         system: { weight, quantity: 1, location, isTagalong: false, ...extra } };
}
function encumbered(items) {
	const c = makeCharacter({ str: 11 }, 5, items);
	c.physical = { weight: 200 };
	c.prepareDerivedData();
	return c.encumbrance;
}

const e0 = encumbered([]);
check("max load = load limit x body weight", e0.maxLoad, 200);
check("band thresholds at 25/50/75/100%",
	[e0.none, e0.slight, e0.moderate, e0.heavy], [50, 100, 150, 200]);
// His labels (calcEncumbrance), not the ones the port first invented.
check("nothing carried is not encumbered", e0.status, "Not encumbered");

check("carried weight totals up",        encumbered([gear(30), gear(25)]).carried, 55);
check("just over a quarter is slightly encumbered", encumbered([gear(60)]).status, "Slightly encumbered");
check("just over a half is encumbered",  encumbered([gear(120)]).status, "Encumbered");
check("just over three quarters is heavily encumbered", encumbered([gear(175)]).status, "Heavily encumbered");
check("beyond the load limit cannot move", encumbered([gear(250)]).status, "Over weight(cannot move)");

// The character carries the size scaling through from its own height and weight: 5'9" and 200 lb
// puts armour and gear at x.9, while weapons are not scaled.
function sized(items) {
	const c = makeCharacter({ str: 11 }, 5, items);
	c.physical = { weight: 200, heightFeet: 5, heightInches: 9 };
	c.prepareDerivedData();
	return c;
}
check("a 5'9\" 200 lb character carries 100 lb of gear as 90",
	sized([gear(100)]).encumbrance.carried, 90);
check("...but a 10 lb sword as 10",
	sized([{ type: "weapon", name: "sword", system: { weight: 10, quantity: 1, location: "carried" } }]).encumbrance.carried, 10);

// The Player's Guide's movement penalty, beside his unencumbered rates rather than over them.
const noRace = encumbered([gear(120)]);
check("the loaded rates are worked out even with no race",
	typeof makeCharacter({}, 5).movement.loaded, "object");
check("an encumbered character's penalty reads as the book words it",
	noRace.penalty, "1/2 speed");
check("an unburdened character carries no penalty text", e0.penalty, "");

// Things not on your person do not weigh you down.
check("stashed gear does not count",  encumbered([gear(500, "stash")]).carried, 0);
check("gear on a mount does not count", encumbered([gear(500, "mount")]).carried, 0);
check("equipped gear does count",     encumbered([gear(40, "equipped")]).carried, 40);

// Tagalong items are already counted inside another item's weight -- charging them again
// would double-bill the character.
check("tagalong items are not double counted",
	encumbered([gear(10), gear(999, "carried", { isTagalong: true })]).carried, 10);

// Quantity multiplies.
check("quantity multiplies weight",
	encumbered([{ type: "equipment", name: "arrows",
	  system: { weight: 0.1, quantity: 20, location: "carried", isTagalong: false } }]).carried, 2);

// --- a shield on the body, as the fifth layer -------------------------------------
// From equipShield. A shield is held in the off hand, so a right-hander is covered down the
// LEFT side, and its value stacks on top of whatever armour is already worn there. Its own
// armour value sits in the left-hand column whatever hand holds it, so the model has to keep
// it out of the ordinary armour total as well -- otherwise a left-hander would be shielded on
// the wrong hand, and the right hand would be protected twice.
const mediumShield = {
	type: "armor", name: "Shield(Medium/Steel)",
	system: { location: "equipped", material: "Steel", weight: 8, quantity: 1, isShield: true,
	          bucklerOnWrist: false, magicBonus: 0,
	          penalties: { skills: 0, defense: 0, initiative: 0, speed: 0 },
	          coverage: { head: 0, neck: 0, shoulderLeft: 0, shoulderRight: 0, torsoUpper: 0,
	                      torsoMid: 0, torsoLower: 0, armLeft: 0, armRight: 0, forearmLeft: 0,
	                      forearmRight: 0, handLeft: 20, handRight: 0, thighLeft: 0, thighRight: 0,
	                      shinLeft: 0, shinRight: 0, footLeft: 0, footRight: 0 } }
};
const areaOf = (c, name) => c.body.areas.find(a => a.name == name);

const shielded = makeCharacter({ str: 14, vit: 14 }, 5, [mediumShield]);
check("a right-hander's shield covers the left arm",   areaOf(shielded, "Left Arm").armor, 20);
check("...the left forearm",                           areaOf(shielded, "Left Forearm").armor, 20);
check("...and the left hand",                          areaOf(shielded, "Left Hand").armor, 20);
check("the right arm is untouched",                    areaOf(shielded, "Right Arm").armor, 0);
check("and so is the right hand",                      areaOf(shielded, "Right Hand").armor, 0);
check("the shield's own share is reported separately", areaOf(shielded, "Left Hand").shield, 20);
check("the covering shield is named",                  areaOf(shielded, "Left Hand").shieldLayers,
	["Shield(Medium/Steel)"]);
check("a shielded area counts as protected",           areaOf(shielded, "Left Hand").protectedByArmor, true);

// The left hand is exactly where a shield's handLeft coverage column would have landed it if it
// were treated as ordinary armour, so this is the test that it is not counted twice.
check("the left hand is shielded once, not twice",     areaOf(shielded, "Left Hand").armor, 20);

const southpaw = makeCharacter({ str: 14, vit: 14 }, 5, [mediumShield], { handedness: "Left" });
check("a left-hander is shielded on the right",        areaOf(southpaw, "Right Arm").armor, 20);
check("...and not on the left",                        areaOf(southpaw, "Left Arm").armor, 0);

const ambi = makeCharacter({ str: 14, vit: 14 }, 5, [mediumShield], { handedness: "Ambidextrous" });
check("Ambidextrous shields on the left, as his else branch does",
	areaOf(ambi, "Left Arm").armor, 20);

// Stacking, and the one thing the shield layer does not share: armour damage. His sheet keeps
// the shield in its own layer and clears it wholesale, rather than degrading it area by area.
const both = makeCharacter({ str: 14, vit: 14 }, 5, [scaleSuit, mediumShield]);
check("a shield stacks on the armour already worn",    areaOf(both, "Left Arm").armor, 32);
check("where the armour does not reach, only the shield counts",

	{ armorDamage: { "Left Arm": 5 } });
check("armour damage comes off the worn armour, not the shield",
	areaOf(dented, "Left Arm").armor, 27);

// A magical shield adds its plus and then doubles the whole value: (20+2)*2 = 44.
const magic = makeCharacter({ str: 14, vit: 14 }, 5, [{ ...mediumShield,
	system: { ...mediumShield.system, magicBonus: 2 } }]);
check("a +2 shield adds then doubles",                 areaOf(magic, "Left Hand").armor, 44);

	system: { attr1: "AGL", attr2: "", skillRating: 4, startingBonus: 0, abilityBonus: 0,
	          misc: 0, isCommon: false, category: "class" } };

	system: { attr1: "AGL", attr2: "", skillRating: 4, startingBonus: 0, abilityBonus: 0,

	notEligible.combat.secondWeaponKnowChance, 0);

	[slots.attributes.knw.mods.classSkills, slots.attributes.knw.mods.raceSkills, slots.attributes.knw.mods.socialSkills]);
check("with no trades made, the allowance is the untraded figure",
	[slots.skillSlots.classBase, slots.skillSlots.racialBase, slots.skillSlots.socialBase],
	[slots.skillSlots.class, slots.skillSlots.racial, slots.skillSlots.social]);

// --- the slot tricks, as rules -----------------------------------------------------
// The four rates are his, from the four conversion functions: racial buys a class slot one for
// one or two social slots, and two social slots buy back one racial or one class slot. There is
// no trade out of class in his sheet at all, which is why there is no fifth entry to test.
const base = { class: 10, racial: 6, social: 4 };
check("one racial buys one class",
	S.getSlotAllowance(base, { racialToClass: 1 }), { class: 11, racial: 5, social: 4 });
check("one racial buys TWO social",
	S.getSlotAllowance(base, { racialToSocial: 1 }), { class: 10, racial: 5, social: 6 });
check("two social buy one racial",
	S.getSlotAllowance(base, { socialToRacial: 1 }), { class: 10, racial: 7, social: 2 });
check("two social buy one class",
	S.getSlotAllowance(base, { socialToClass: 1 }), { class: 11, racial: 6, social: 2 });
check("the same trade twice costs twice",
	S.getSlotAllowance(base, { racialToSocial: 2 }), { class: 10, racial: 4, social: 8 });
check("trades in different directions both land",
	S.getSlotAllowance(base, { racialToClass: 1, socialToClass: 2 }),
	{ class: 13, racial: 5, social: 0 });
check("class slots are never traded away, only into",
	Object.values(S.SLOT_TRANSFERS).some(t => t.from == "class"), false);

// A slot given up for a bonus costs the slot and buys no other slot at all.
check("giving up a racial slot costs the slot",
	S.getSlotAllowance(base, { racialSacrificed: 2 }), { class: 10, racial: 4, social: 4 });
check("giving up a social slot likewise",
	S.getSlotAllowance(base, { socialSacrificed: 1 }), { class: 10, racial: 6, social: 3 });
check("no moves at all changes nothing", S.getSlotAllowance(base, {}), base);
check("only racial and social can be given up", S.SACRIFICEABLE_SLOTS, ["racial", "social"]);

// His guard: the slot spent has to be one that is still open. A filled slot cannot be traded.
check("a trade needs an unused slot to spend",
	S.canTransferSlot("racialToClass", { racial: 3 }, { racial: 3 }).allowed, false);
check("...and goes through when one is free",
	S.canTransferSlot("racialToClass", { racial: 3 }, { racial: 2 }).allowed, true);
check("a two-slot trade needs BOTH free",
	S.canTransferSlot("socialToClass", { social: 3 }, { social: 2 }).allowed, false);
check("...and goes through with two free",
	S.canTransferSlot("socialToClass", { social: 3 }, { social: 1 }).allowed, true);
check("an unknown trade is refused rather than guessed at",
	S.canTransferSlot("classToRacial", { class: 9 }, { class: 0 }).allowed, false);
check("giving up a slot needs a skill for the bonus to land on",
	S.canSacrificeSlot("racial", { racial: 3 }, { racial: 0 }, false).allowed, false);
check("...and goes through with one",
	S.canSacrificeSlot("racial", { racial: 3 }, { racial: 0 }, true).allowed, true);
check("a class slot cannot be given up",
	S.canSacrificeSlot("class", { class: 9 }, { class: 0 }, true).allowed, false);

// --- dual class -------------------------------------------------------------------------
// His Roll20 sheet has no provision for this at all -- one classname field -- so every figure
// below is the Player's Guide's, not a port. Each class advances on its own title, which is why
// the title lives on the class item once there are two of them.
const dualClass = (name, opts = {}) => ({
	type: "class", name,
	system: {
		attackSkillList: opts.attackSkillList ?? "Beginner at 1, Novice at 4",
		loreAttackTitle: opts.loreAttackTitle ?? 0,
		weaponLoreTitle: opts.weaponLoreTitle ?? 0,
		missileLoreTitle: opts.missileLoreTitle ?? 0,
		projectileLoreTitle: 0, secondWeaponKnowTitle: 0, secondWeaponLoreTitle: 0,
		multiMissileLoreTitle: 0,
		skillSlotsNeeded: opts.skillSlotsNeeded ?? 0,
		title: opts.title ?? 0,
		classType: opts.classType ?? "Primary class",
		requirements: { alignment: "Any", focusAttributes: "", attribQualify: opts.attribQualify ?? [] },
		advancement: { titles: opts.titles ?? [] }, classMods: []
	},
	getTitleName(t) { const a = this.system.advancement.titles; const i = parseInt(t) - 1;
	                  return (i < 0 || i >= a.length) ? "" : a[i]; }
});

const singleClassed = makeCharacter({ knw: 20 }, 5, [dualClass("Warrior")]);
check("one class is not dual classed", singleClassed.identity.isDualClass, false);
check("...and its title still comes from the character, as it always did",
	singleClassed.identity.classes[0].title, 5);

// Each class carries its own title. Zero on the class means "follow the character's own".
const mageWarrior = makeCharacter({ knw: 20 }, 1, [
	dualClass("Mage", { title: 2, attackSkillList: "Beginner at 1" }),
	dualClass("Warrior", { title: 1, attackSkillList: "Beginner at 1, Novice at 2, Intermediate at 5" })
]);
check("two classes is dual classed", mageWarrior.identity.isDualClass, true);
check("named for both, as the book writes them", mageWarrior.identity.classNames, "Mage/Warrior");
check("each class keeps its own title",
	mageWarrior.identity.classes.map(c => [c.name, c.title]), [["Mage", 2], ["Warrior", 1]]);

// Experience and Advancement rule 5: attack skill is the greater of the two values -- and each
// class is read at ITS OWN title, so the Warrior's chart at title 1 beats the Mage's at title 2.
check("the attack skill is the better of the two charts", mageWarrior.combat.attackSkill, "Beginner");
const fightingMage = makeCharacter({ knw: 20 }, 1, [
	dualClass("Mage", { title: 9, attackSkillList: "Beginner at 1" }),
	dualClass("Warrior", { title: 6, attackSkillList: "Beginner at 1, Novice at 2, Intermediate at 5" })
]);
check("...which is the Warrior's at title 6, not the Mage's at 9",
	fightingMage.combat.attackSkill, "Intermediate");
check("a classless character still has no chart",
	makeCharacter({}, 12).combat.attackSkill, "None");

// Class Determination rule 5 and Advancement rule 4: the skills of both classes, better applying.
// So a lore either class has reached is held, each judged on that class's own title.
const loreFromSecond = makeCharacter({ knw: 20 }, 1, [
	dualClass("Mage", { title: 12 }),
	dualClass("Warrior", { title: 6, weaponLoreTitle: 6 })
]);
check("a lore only the second class grants is still held", loreFromSecond.combat.hasWeaponLore, true);
check("...and reports the threshold of the class that granted it",
	loreFromSecond.combat.weaponLoreTitle, 6);
const loreNotYet = makeCharacter({ knw: 20 }, 1, [
	dualClass("Mage", { title: 12 }),
	dualClass("Warrior", { title: 5, weaponLoreTitle: 6 })
]);
check("a class short of its own threshold does not grant it",
	loreNotYet.combat.hasWeaponLore, false);
check("...and the threshold still shown is the one it is short of",
	loreNotYet.combat.weaponLoreTitle, 6);
check("a lore neither class ever gets stays at zero",
	loreNotYet.combat.missileLoreTitle, 0);

// Both progressions come out of one Knowledge allowance, which is the book's own reason the slot

// Player's Guide, "Who Can Use a Skill": the base chance alone, no starting bonus. Same first

// --- duplicate skills ---------------------------------------------------------------
// Player's Guide, "Duplicate Class and Racial Skills": roll for each copy, take the best. His
// worked example is a failed roll beside a made one, and a critical beside an ordinary success.
check("rolled at the chance succeeds", S.resolveSkillOutcome(60, 60).outcome, "Succeeded");
check("one over fails", S.resolveSkillOutcome(60, 61).outcome, "Failed");
check("beating it by more than 20 is critical", S.resolveSkillOutcome(60, 39).outcome, "Critical success");
check("...and by exactly 20 is not", S.resolveSkillOutcome(60, 40).outcome, "Succeeded");
check("missing by more than 20 is a critical failure", S.resolveSkillOutcome(60, 81).outcome, "Critical failure");
check("...and by exactly 20 is not", S.resolveSkillOutcome(60, 80).outcome, "Failed");

const failMade = [S.resolveSkillOutcome(40, 75), S.resolveSkillOutcome(60, 50)];
check("his example: one failed and one made is a success",
	S.pickBestSkillRoll(failMade).best.outcome, "Succeeded");
check("...and the made one is the one chosen", S.pickBestSkillRoll(failMade).bestIndex, 1);
const critAndPlain = [S.resolveSkillOutcome(90, 60), S.resolveSkillOutcome(40, 39)];
check("his example: a critical beside an ordinary success is the critical",
	S.pickBestSkillRoll(critAndPlain).best.outcome, "Critical success");
check("the copies are rolled against their OWN chances, not a shared one",
	S.pickBestSkillRoll(critAndPlain).rolls.map(r => r.chance), [90, 40]);
check("every roll is reported, not just the winner",
	S.pickBestSkillRoll(failMade).rolls.length, 2);
check("two of the same outcome pick the wider margin",
	S.pickBestSkillRoll([S.resolveSkillOutcome(40, 39), S.resolveSkillOutcome(60, 45)]).bestIndex, 1);
check("a single copy is simply itself",
	S.pickBestSkillRoll([S.resolveSkillOutcome(50, 10)]).bestIndex, 0);
check("no copies at all is not an error", S.pickBestSkillRoll([]).best, null);

// --- resistance rolls ---------------------------------------------------------------------------
// Daryl's 0.11.1 Blocker: the five resistances were shown and could not be rolled. His own five
// handlers (handleMagicResist, sheet-worker.js:1231, and four identical to it) give their answers
// in a fixed order, and this follows it. See module/resistance-rules.mjs and UPSTREAM item 48.
const RES = await import("../module/resistance-rules.mjs");
const resist = (chance, roll, immune = false, mod = 0) =>
	RES.resolveResistanceRoll(chance, roll, immune, mod).outcome;

check("a roll under the chance resists", resist(60, 45), "Resisted");
check("a roll over the chance does not", resist(60, 75), "Did not resist");
check("a roll on the chance exactly still resists", resist(60, 60), "Resisted");
check("at or under half, it is resisted by half", resist(60, 30), "Resisted by half");
check("one over half is an ordinary success", resist(60, 31), "Resisted");
// His half is parseInt((chance+1)/2), which rounds UP on an odd chance -- and differs from the
// attribute save's half in the same codebase, which is a floor. Both are ported as written.
check("his half rounds up on an odd chance: 51% halves to 26, not 25",
	[RES.halfResistance(51), RES.halfResistance(50), RES.halfResistance(1), RES.halfResistance(0)],
	[26, 25, 1, 0]);
check("...so 26 against 51% is still resisted by half", resist(51, 26), "Resisted by half");
// Immunity answers before anything is rolled, and says the effect never happened.
check("immunity beats the roll entirely", resist(0, 100, true), "Immune");
check("...even a rolled 100", RES.resolveResistanceRoll(0, 100, true, 0).resisted, true);
// 200% is his "virtually immune", and it beats a rolled 100.
check("200% or more resists whatever is rolled", resist(200, 100), "Resisted");
check("...and 199% does not", resist(199, 100), "Did not resist");
// The two natural rolls.
check("a natural 100 fails even on a high chance", resist(150, 100), "Did not resist");
check("a natural 1 succeeds even on a 0% chance", resist(0, 1), "Resisted by half");
check("...which is the one answer his handlers give differently (item 48)",
	RES.resolveResistanceRoll(0, 1, false, 0).reason, "a natural 1 -- an automatic success");
// The modifier his second button per track prompts for.
check("a modifier moves the chance before anything is compared",
	[resist(40, 55, false, 20), resist(60, 55, false, -20)], ["Resisted", "Did not resist"]);
check("the card reports the modified chance, not the printed one",
	RES.resolveResistanceRoll(40, 55, false, 20).chance, 60);
// A missing or nonsense figure must not throw -- a creature's stat block may leave one blank.
check("a blank chance is nothing, not a crash",
	[resist(null, 50), resist(undefined, 50), resist("", 50)],
	["Did not resist", "Did not resist", "Did not resist"]);
check("the chat line names the track and what happened",
	RES.describeResistanceRoll("Poison", RES.resolveResistanceRoll(60, 45, false, 0)),
	"Poison Resistance &mdash; rolled 45% against 60% &mdash; <strong>Resisted</strong>");
check("...and an immune track says it had no effect",
	RES.describeResistanceRoll("Magic", RES.resolveResistanceRoll(0, 50, true, 0)),
	"Magic Resistance &mdash; <strong>Immune</strong> &mdash; it had no effect");

check("...with a 1d4 Endurance roll a title and +1 to start",
	[famorian.endurance.titleFormula, famorian.endurance.startMod], ["1d4", 1]);
check("...and -10% disease resistance, which only an evoke moves",
	[famorian.resistanceMods.disease, famorian.resistanceMods.poison,
	 famorian.resistanceMods.control, famorian.resistanceMods.magic], [-10, 0, 0, 10]);
check("it has no special movement until an evoke gives it one",
	famorian.movement.specialName, "None:");
check("his seven breeds are all there, spanning 1 to 100 with no gap",
	[famorian.famorian.breeds.length, famorian.famorian.breeds[0].low,
	 famorian.famorian.breeds[6].high,
	 famorian.famorian.breeds.every((b, i, a) => i === 0 || b.low === a[i - 1].high + 1)],
	[7, 1, 100, true]);
check("...with his own budgets, written as the dice they are",
	famorian.famorian.breeds.map(b => `${b.breed} ${b.evokes}`),
	["Hidden Breed 1", "Trace Breed 1d2", "Low Breed 1d4", "Breed 1d4+1", "High Breed 1d6+1",
	 "True Breed All", "Inbreed 1d6+2"]);
check("all 120 evokes are catalogued", famorian.famorian.evokes.length, 120);
// One of his `if`s tests the wrong checkbox, so Budding could never be listed -- UPSTREAM item 49.
check("Regeneration(Budding) survived the misgated `if` that hides it in his sheet",
	famorian.famorian.evokes.find(e => e.key === "regen_budding")?.label, "Regeneration,Budding");

// The breed roll and its budget.
check("the d100 lands in his bands",
	[FAM.getFamorianBreed(famorian.famorian.breeds, 1).breed,
	 FAM.getFamorianBreed(famorian.famorian.breeds, 11).breed,
	 FAM.getFamorianBreed(famorian.famorian.breeds, 41).breed,
	 FAM.getFamorianBreed(famorian.famorian.breeds, 100).breed],
	["Hidden Breed", "Trace Breed", "Breed", "Inbreed"]);
const breedOf = (n) => famorian.famorian.breeds.find(b => b.breed === n);
check("a flat budget needs no die", FAM.rollEvokeBudget(breedOf("Hidden Breed"), () => 3), 1);
check("1d4+1 rolls one die and adds one", FAM.rollEvokeBudget(breedOf("Breed"), () => 3), 4);
check("1d6+2 likewise", FAM.rollEvokeBudget(breedOf("Inbreed"), () => 4), 6);
// "All" is an ABSENCE of a ceiling, not a big number: his own check reads `!= "All"` first.
check("a True Breed has no ceiling at all", FAM.rollEvokeBudget(breedOf("True Breed"), () => 6), null);
check("over budget is reported, never refused",
	[FAM.checkEvokeBudget(["wings", "fins", "speed"], 2).issue.includes("allows 2"),
	 FAM.checkEvokeBudget(["wings"], 2).issue,
	 FAM.checkEvokeBudget(["a", "b", "c"], null).issue],
	[true, "", ""]);

// The fifteen that change a number.
check("exactly fifteen evokes change a number; the other 105 are described, not applied",
	Object.keys(FAM.FAMORIAN_NUMERIC_EVOKES).length, 15);
const built = (keys, bonuses) => FAM.applyFamorianEvokes(famorian, keys, bonuses ?? {});
check("the three attribute evokes add the 1d3 kept on the character",
	[built(["str", "vit"], { str: 3, vit: 1 }).attributeMods.str,
	 built(["str", "vit"], { str: 3, vit: 1 }).attributeMods.vit,
	 built(["str"], { str: 3 }).attributeMods.agl], [3, 1, 0]);
check("the Endurance evoke replaces the roll outright",
	[built(["end"]).endurance.titleFormula, built(["end"]).endurance.startMod,
	 built(["end"]).endurance.titleMod], ["1d4+2", 3, 2]);
// His resistance figures are ABSOLUTE, which is why "+20%" on the sheet writes 10 over a base of -10.
check("Enhanced Disease Resist writes 10 over a base of -10, a swing of the 20% it advertises",
	[famorian.resistanceMods.disease, built(["disease_resist"]).resistanceMods.disease], [-10, 10]);
check("...and the other two resistance evokes set theirs",
	[built(["poison_resist"]).resistanceMods.poison, built(["stubborn"]).resistanceMods.control],
	[20, 20]);
// Four evokes write the same movement slots, and his own comment says swimming is least important.
check("wings beat legs beat insect legs beat fins, which is his order",
	[built(["fins"]).movement.specialName,
	 built(["fins", "extra_insect_legs"]).movement.specialName,
	 built(["fins", "extra_insect_legs", "extra_legs"]).movement.specialName,
	 built(["fins", "extra_insect_legs", "extra_legs", "wings"]).movement.specialName],
	["Swim:", "Scurry:", "Gallop:", "Fly:"]);
check("...and taking wings alone still flies, whatever order they are listed in",
	built(["wings", "fins"]).movement.specialName, "Fly:");
check("Scurry carries his odd 10-second modifier of 40",
	[built(["extra_insect_legs"]).movement.special.tenSecMod,
	 built(["extra_insect_legs"]).movement.special.hourlyMod], [40, 4]);
check("the speed evokes write the multiplier, last one winning",
	[built(["speed"]).movement.speedMultiplier,
	 built(["speed", "metabolism_very_slow"]).movement.speedMultiplier,
	 built(["hooves"]).movement.speedMultiplier], [1.5, 0.5, 1.5]);
check("jumping is the only evoke that touches the jump",
	[built(["jumping"]).movement.jumpStand, built(["jumping"]).movement.jumpUp,
	 built([]).movement.jumpStand], ["x3", "x2", 0]);
check("an evoke with no numeric effect changes nothing at all",
	JSON.stringify(built(["night_vision", "quills", "beak"])) === JSON.stringify(built([])), true);
check("the base race is never mutated by applying evokes",
	[famorian.movement.specialName, famorian.resistanceMods.disease], ["None:", -10]);
check("a race that is not a Famorian passes through untouched",
	FAM.applyFamorianEvokes(raceByName("Nixie").system, ["wings"], {}) === raceByName("Nixie").system, true);

// What the sheet lists: every evoke taken, numeric or not.
const described = FAM.describeEvokes(famorian, ["str", "night_vision"], { str: 2 });
check("a taken evoke is listed with his own label and rules",
	[described.length, described[0].label, described[0].numeric,
	 described[1].label, described[1].numeric,
	 described[1].detail.length > 0],
	[2, "Strength (+2)", true, "Night Vision", false, true]);

// His height and frame tables are keyed by HIS names, so a form has to be looked up under its
// source race or a character of one gets no height and therefore no weight.
check("his height table has never heard of the port's own names for the faerie forms",
	["Fairy(Winged)", "Podling(Wingless)"].filter(n => PT.HEIGHT_TYPE_BY_RACE[n]), []);
check("...so each form's sourceRace is a name it does have",
	["Fairy(Winged)", "Fairy(Dark Wingless)", "Podling(Winged)", "Sporeling(Wingless)", "Maginos(Metal)"]
		.filter(n => !PT.HEIGHT_TYPE_BY_RACE[raceByName(n).system.sourceRace]), []);
check("Elementalist's death path carries his alignment requirement",
	classByName("Elementalist(Call of Death)").system.requirements.alignment,
	"True Neutral or Neutral Evil");
check("the Inquisitor's two paths differ in the skill they are named for",
	[classByName("Inquisitor(Bless)").system.advancement.classSkillList
		.some(e => e.name === "Bless" && e.title === 3),
	 classByName("Inquisitor(Blasphemy)").system.advancement.classSkillList
		.some(e => e.name === "Blasphemy" && e.title === 3)], [true, true]);
check("Knight(Templar) takes Shield Knowledge where the plain Knight takes Stun, both at title 4",
	[classByName("Knight(Templar)").system.advancement.classSkillList
		.some(e => e.name === "Shield Knowledge" && e.title === 4),
	 classByName("Knight").system.advancement.classSkillList
		.some(e => e.name === "Stun" && e.title === 4)], [true, true]);
check("Mage carries a no-casting alternative for a race that cannot cast",
	classByName("Mage").system.advancement.classSkillList.some(e => e.requires === "nonCaster"), true);
check("GME is non-classed, with no class skills at all",
	[classByName("GME").system.nonClassed,
	 classByName("GME").system.advancement.classSkillList.length], [true, 0]);
check("Warrior bars no race", classByName("Warrior").system.blockedRaces, []);
check("every class skill arrives at a title within his 1-15",
	classDocs.filter(d => d.system.advancement.classSkillList
		.some(e => e.title < 1 || e.title > 15)).map(d => d.name), []);
check("every class has the twelve Arch Mortal attribute entries, and GME alone has no core skills",
	[classDocs.filter(d => Object.keys(d.system.archMortal.attributes).length !== 12).length,
	 classDocs.filter(d => d.system.archMortal.skills.length === 0).map(d => d.name)],
	[0, ["GME"]]);
// The defect he authorised the repair for (UPSTREAM-ISSUES item 1): Monk's row was a column
// short, so every field from armour usage onward read the one to its left -- armour usage showed
// the weapon list. The two now differ, and each reads as what it is.
const monk = classByName("Monk").system;
check("Monk's armour usage reads as armour, not as his weapon list",
	[monk.armorUsage === monk.weaponUsage, monk.armorUsage.toLowerCase().includes("helm")],
	[false, true]);
check("...and the fields after it landed in the right columns too",
	[monk.advancement.titles.length > 0, monk.classMods.length > 0,
	 monk.requirements.attribQualify.length], [true, true, 12]);

const passed = results.filter(r => r.startsWith("PASS")).length;
const failed = results.length - passed;
document.getElementById("out").innerHTML =
	results.map(r => `<span class="${r.startsWith("PASS") ? "p" : "f"}">${r}</span>`).join("\n")
	+ `\n\n${passed} passed, ${failed} failed`;
</script>
