<!doctype html>
<meta charset="utf-8">
<title>Imagine RPG syntax check</title>
<pre id="out">running...</pre>
<script type="module">
// Build-time sanity check. Imports each system module and reports whether it PARSES.
//
// Must be served over HTTP -- opening it as a file:// page renders a static snapshot
// where relative module specifiers do not resolve, which produces a misleading pass.
//     python -m http.server 8777 --bind 127.0.0.1
//     open http://127.0.0.1:8777/tools/syntax-check.html
//
// The modules cannot actually run outside Foundry -- they reference globals like
// foundry.data.fields and Hooks that do not exist here. That is fine and expected:
// a SyntaxError means the file is genuinely malformed, while a ReferenceError means
// the syntax is valid and it only failed for want of Foundry. We distinguish the two.
const files = [
	"../module/apps/item-picker.mjs",
	"../module/famorian-rules.mjs",
	"../module/item-directory.mjs",
	"../module/resistance-rules.mjs",
	"../module/sheet-theme.mjs",
	"../module/starting-kit-tables.mjs",
	"../module/starting-kit.mjs",
	"../module/starting-money.mjs",
	"../module/wealth-rules.mjs",
	"../module/changelog.mjs",
	"../module/apps/availability-config.mjs",
	"../module/apps/character-generator.mjs",
	"../module/chargen-view.mjs",
	"../module/availability.mjs",
	"../module/combat-tables.mjs",
	"../module/combat/attack.mjs",
	"../module/combat/combat-document.mjs",
	"../module/combat/combat-rules.mjs",
	"../module/combat/creature-attack.mjs",
	"../module/combat/creature-rules.mjs",
	"../module/combat/martial-arts.mjs",
	"../module/combat/martial-attack.mjs",
	"../module/martial-view.mjs",
	"../module/config-tables.mjs",
	"../module/content-importer.mjs",
	"../module/creature-tables.mjs",
	"../module/data/actor-character.mjs",
	"../module/data/actor-creature.mjs",
	"../module/data/item-armor.mjs",
	"../module/data/item-class.mjs",
	"../module/data/item-creature-attack.mjs",
	"../module/data/item-equipment.mjs",
	"../module/data/item-power.mjs",
	"../module/data/item-race.mjs",
	"../module/data/item-skill.mjs",
	"../module/data/item-trait.mjs",
	"../module/data/item-weapon.mjs",
	"../module/data/item-consumable.mjs",
	"../module/data/item-lore.mjs",
	"../module/data/item-spell.mjs",
	"../module/data/item-invocation.mjs",
	"../module/lore-tables.mjs",
	"../module/lore-rules.mjs",
	"../module/starting-lore.mjs",
	"../module/magic-view.mjs",
	"../module/magic-actions.mjs",
	"../module/weapon-custom-tables.mjs",
	"../module/weapon-custom-rules.mjs",
	"../module/weapon-mods-view.mjs",
	"../module/apps/weapon-mods.mjs",
	"../module/imagine-rpg.mjs",
	"../module/skills-rules.mjs",
	"../module/race-rules.mjs",
	"../module/class-rules.mjs",
	"../module/physique-tables.mjs",
	"../module/physique-rules.mjs",
	"../module/advancement-tables.mjs",
	"../module/advancement-rules.mjs",
	"../module/advancement.mjs",
	"../module/levelup-view.mjs",
	"../module/apps/level-up.mjs",
	"../module/situational-view.mjs",
	"../module/apps/situational-mods.mjs",
	"../module/combat/round-rules.mjs",
	"../module/round-view.mjs",
	"../module/combat/combat-tracker.mjs",
	"../module/apps/round-clock.mjs",
	"../module/class-advancement.mjs",
	"../module/chargen-rules.mjs",
	"../module/natural-weapons.mjs",
	"../module/equip-rules.mjs",
	"../module/sheets/actor-character-sheet.mjs",
	"../module/sheets/actor-creature-sheet.mjs",
	"../module/sheets/item-sheet.mjs"
];

const lines = [];
for (const f of files) {
	try {
		await import(f);
		lines.push(`PARSE OK + RAN     ${f}`);
	} catch (err) {
		const kind = err instanceof SyntaxError ? "SYNTAX ERROR" : "parse ok";
		lines.push(`${kind.padEnd(18)} ${f}\n                   ${err.name}: ${err.message}`);
	}
}
document.getElementById("out").textContent = lines.join("\n");
</script>
