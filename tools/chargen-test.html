<!doctype html>
<meta charset="utf-8">
<title>Imagine RPG character generation test</title>
<style>body{font:13px monospace;padding:1rem}.p{color:#0a0}.f{color:#c00;font-weight:bold}</style>
<pre id="out">running...</pre>
<script type="module">
// Tests for module/chargen-rules.mjs, checked against his character-creation code and the
// Player's Guide's own statements of the rules. Every die is scripted, never random.
//
// Must be served over HTTP:
//     python -m http.server 8777 --bind 127.0.0.1
//     open http://127.0.0.1:8777/tools/chargen-test.html
const C = await import("../module/chargen-rules.mjs");

const results = [];
function check(label, actual, expected) {
	const ok = JSON.stringify(actual) === JSON.stringify(expected);
	results.push(`${ok ? "PASS" : "FAIL"}  ${label}\n        expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
}
// A roller that hands out the given faces in order, then repeats the last.
const dice = (...faces) => { let i = 0; return () => faces[Math.min(i++, faces.length - 1)]; };
const always = (face) => () => face;

// --- dice expressions -------------------------------------------------------------------------
check("7d4d2 drops the two lowest: 1,1,4,4,4,3,2 keeps 4+4+4+3+2", C.rollDicePool("7d4d2", dice(1, 1, 4, 4, 4, 3, 2)), 17);
check("6d4d1 drops the lowest one", C.rollDicePool("6d4d1", dice(1, 2, 2, 2, 2, 2)), 10);
check("5d4 keeps all five", C.rollDicePool("5d4", always(3)), 15);
check("a skill's starting dice ignore the % label", C.rollDicePool("2d6%", always(6)), 12);
check("his 'dl0' typo reads as d10", C.rollDicePool("5dl0%", always(10)), 50);
check("'Special' starts at nothing", C.rollDicePool("Special", always(6)), 0);
check("blank starts at nothing", C.rollDicePool("", always(6)), 0);

// --- the four character types -----------------------------------------------------------------
check("his dice per attribute: STR 7d4d2, INT 6d4d1, SOC 5d4",
	[C.ATTRIBUTE_DICE.str, C.ATTRIBUTE_DICE.int, C.ATTRIBUTE_DICE.soc, C.ATTRIBUTE_DICE.wil], ["7d4d2", "6d4d1", "5d4", "5d4"]);
check("Adventurer rolls one set", C.rollAttributeSets("adventurer", always(2)).sets.length, 1);
check("Heroic rolls two", C.rollAttributeSets("heroic", always(2)).sets.length, 2);
check("Legendary rolls three", C.rollAttributeSets("legendary", always(2)).sets.length, 3);
check("with all 4s every attribute of an Adventurer is 20 (five dice kept)",
	Object.values(C.rollAttributeSets("adventurer", always(4)).best), Array(12).fill(20));
check("Normal is the book's 5d4 for everything", C.CHARACTER_TYPES.normal.flatDice, "5d4");
check("Normal adjusts 2:1, the rest 3:1",
	[C.CHARACTER_TYPES.normal.ratio, C.CHARACTER_TYPES.adventurer.ratio, C.CHARACTER_TYPES.legendary.ratio], [2, 3, 3]);
// Heroic: the higher of two per attribute. Set one all 1s (5 each), set two all 4s (20 each).
const diceInASet = Object.values(C.ATTRIBUTE_DICE).reduce((n, d) => n + parseInt(d), 0);
const heroic = C.rollAttributeSets("heroic", (() => { let i = 0; return () => (i++ < diceInASet ? 1 : 4); })());
check("Heroic keeps the higher of the two rolls for each attribute", heroic.best.str, 20);
check("...and reports both sets", [heroic.sets[0].str, heroic.sets[1].str], [5, 20]);

// --- swaps ------------------------------------------------------------------------------------
const tens = Object.fromEntries(C.ATTRIBUTE_ORDER.map(k => [k, 10]));
check("a 3:1 swap takes three and gives one",
	[C.applySwap(tens, { to: "str", from: ["agl", "agl", "wis"] }).str,
	 C.applySwap(tens, { to: "str", from: ["agl", "agl", "wis"] }).agl], [11, 8]);
check("the wrong number of points is refused",
	C.checkSwap(tens, { to: "str", from: ["agl", "agl"] }, 3).allowed, false);
check("Social Class cannot be raised", C.checkSwap(tens, { to: "soc", from: ["agl", "agl", "wis"] }, 3).allowed, false);
check("...or spent", C.checkSwap(tens, { to: "str", from: ["soc", "agl", "wis"] }, 3).allowed, false);
check("nothing may be left below 5",
	C.checkSwap({ ...tens, agl: 6 }, { to: "str", from: ["agl", "agl", "wis"] }, 3).allowed, false);
check("...but exactly 5 is fine",
	C.checkSwap({ ...tens, agl: 7 }, { to: "str", from: ["agl", "agl", "wis"] }, 3).allowed, true);
check("Normal's 2:1", C.checkSwap(tens, { to: "str", from: ["agl", "wis"] }, 2).allowed, true);

// --- Civilized Humans, and physique -----------------------------------------------------------
check("a Civilized Human gets three points and six moves",
	C.getCivilizedHumanAllowance(["Human(Civilized:Village)"]), { bonus: 3, moves: 6 });
check("half Civilized Human gets the points but not the moves (his setExtraRaceSheets; the book agrees)",
	C.getCivilizedHumanAllowance(["Elf(High)", "Human(Civilized:City)"]), { bonus: 3, moves: 0 });
check("a Barbaric Human gets neither", C.getCivilizedHumanAllowance(["Human(Barbaric)"]), { bonus: 0, moves: 0 });
check("the three points may stack on one attribute",
	C.applyHumanPoints(tens, ["str", "str", "str"], []).str, 13);
check("...but never on Social Class", C.applyHumanPoints(tens, ["soc"], []).soc, 10);
check("a move takes one and gives one",
	[C.applyHumanPoints(tens, [], [{ from: "chm", to: "int" }]).chm,
	 C.applyHumanPoints(tens, [], [{ from: "chm", to: "int" }]).int], [9, 11]);
check("a slight physique is -1 STR, +1 AGL", [C.applyPhysique(tens, true).str, C.applyPhysique(tens, true).agl], [9, 11]);

const built = C.buildRatings({ base: tens, slightPhysique: true, ratio: 3,
	swaps: [{ to: "int", from: ["app", "app", "chm"] }, { to: "soc", from: ["str", "agl", "vit"] }],
	humanBonuses: ["wil"], humanMoves: [] });
check("buildRatings: physique, then the good swap, then the points",
	[built.ratings.str, built.ratings.int, built.ratings.app, built.ratings.wil], [9, 11, 8, 11]);
check("...and the bad swap is refused and reported", built.issues, ["Social Class cannot be adjusted."]);

const finals = C.checkFinalAttributes({ ...tens, str: 19, agl: 4 },
	{ attributeMods: { str: 2, agl: 0 }, attributeLimits: { str: 20, agl: 20 } });
check("race added, then held to its limit", [finals.str.final, finals.str.overLimit], [20, true]);
check("below 5 after the race is flagged", finals.agl.underMinimum, true);

// --- class qualification and starting class skills --------------------------------------------
const mageLike = { requirements: { attribQualify: [0, 0, 0, 15, 0, 0, 0, 0, 0, 14, 0, 0] } };
check("an attribute short of the class is reported",
	C.checkClassQualification(mageLike, C.checkFinalAttributes(tens, {}), ["Human"], false),
	["Needs INT 15; has 10.", "Needs AUR 14; has 10."]);
check("a barred race is reported too",
	C.checkClassQualification({}, C.checkFinalAttributes(tens, {}), ["Elf(High)"], true),
	["Elf(High) is usually not this class."]);

const skillsClass = { advancement: { classSkillList: [
	{ title: 1, name: "Detect Magic", core: false, requires: "" },
	{ title: 1, name: "Scroll Knowledge", core: true, requires: "caster" },
	{ title: 1, name: "Hermetic Lore", core: true, requires: "nonCaster" },
	{ title: 2, name: "Cartography", core: false, requires: "" }] } };
check("a caster starts with the title-1 skills, caster alternative included",
	C.getStartingClassSkills(skillsClass, false).map(s => s.name), ["Detect Magic", "Scroll Knowledge"]);
check("a race that cannot cast takes the no-casting alternative",
	C.getStartingClassSkills(skillsClass, true).map(s => s.name), ["Detect Magic", "Hermetic Lore"]);

check("a class modifier's percentage is read", C.parseClassModPercent("+10% to magical skills"), 10);
check("a CORE class skill: dice + 30",
	C.getClassSkillBonuses({ startingDice: "2d6%", types: [] }, true, ["+30% to core skills"], always(3)),
	{ startingBonus: 6, abilityBonus: 30 });
check("a Magical skill takes '+10% to magical skills'",
	C.getClassSkillBonuses({ startingDice: "1d6%", types: ["Magical"] }, false,
		["+30% to core skills", "+10% to magical skills", "+5% to combat skills"], always(1)),
	{ startingBonus: 1, abilityBonus: 10 });
check("a racial skill's dice count double, plus the race's bonus (his setRacialSkillAbility)",
	C.getRacialSkillBonuses({ startingDice: "2d6%" }, "+10%", always(4)), { startingBonus: 16, abilityBonus: 10 });
check("a social skill: its dice", C.getSocialSkillBonuses({ startingDice: "4d10%" }, always(5)),
	{ startingBonus: 20, abilityBonus: 0 });

// --- handedness and age -----------------------------------------------------------------------
check("his handedness bands: 75 Right, 76 Left, 95 Left, 96 Ambidextrous",
	[75, 76, 95, 96].map(n => C.rollHandedness([], always(n))), ["Right", "Left", "Left", "Ambidextrous"]);
check("an Ambidextrous race always is", C.rollHandedness(["Night Vision", "Ambidextrous"], always(1)), "Ambidextrous");
check("age rolls within the race's range",
	[C.rollStartingAge({ startLow: 18, startHigh: 24 }, always(1)), C.rollStartingAge({ startLow: 18, startHigh: 24 }, always(7))],
	[18, 24]);

// --- assembleCharacter: what the generator actually creates ------------------------------------
// Exercised by the preview but by no test until now. Small hand-made content, so every figure
// here is worked out rather than looked up.
const content = {
	races: [{ name: "Testfolk", type: "race", system: {
		racialSkills: [{ name: "Climb", bonus: "+10%" }],
		ages: { startLow: 18, startHigh: 24, maxAge: "90" }, disabilities: [], abilities: [],
		endurance: { startMod: 2 } } }],
	classes: [{ name: "Tester", type: "class", system: {
		nonClassed: false, classMods: [],
		advancement: { classSkillList: [{ title: 1, name: "Poke", core: true, requires: "" }] } } },
		{ name: "GME", type: "class", system: { nonClassed: true, classMods: [],
			advancement: { classSkillList: [] } } }],
	skills: [
		{ name: "Poke", type: "skill", system: { attr1: "str", attr2: "", skillRating: 10, startingDice: "1d10", types: [] } },
		{ name: "Climb", type: "skill", system: { attr1: "str", attr2: "agl", skillRating: 8, startingDice: "1d10", types: [] } },
		{ name: "Chat", type: "skill", system: { attr1: "chm", attr2: "", skillRating: 9, startingDice: "1d10", types: [] } }
	]
};
const choices = (patch) => Object.assign({
	name: "Tester One", raceNames: ["Testfolk"], className: "Tester",
	classSkills: [{ name: "Poke", core: true }], racialSkillNames: [], socialSkillNames: [],
	ratings: { str: 15, agl: 14, vit: 13, int: 12, wis: 11, knw: 10, app: 10, chm: 10, soc: 10, aur: 10, pty: 10, wil: 10 },
	languages: [], alignment: "", gender: ""
}, patch);

const assembled = C.assembleCharacter(choices({}), content, always(10));
const itemsOf = (b) => b.items ?? b.actor?.items ?? [];
const skillNamed = (b, n) => itemsOf(b).find(i => i.type === "skill" && i.name === n);

check("a new character starts at title 1", assembled.actor.system.identity.title, 1);
check("...and a non-classed one at title 0, his GME",
	C.assembleCharacter(choices({ className: "GME", classSkills: [] }), content, always(10))
		.actor.system.identity.title, 0);
check("a core class skill carries the class's +30",
	[skillNamed(assembled, "Poke").system.category, skillNamed(assembled, "Poke").system.abilityBonus],
	["class", 30]);
check("a racial skill's starting dice count double",
	skillNamed(C.assembleCharacter(choices({ racialSkillNames: ["Climb"] }), content, always(10)), "Climb")
		.system.startingBonus, 20);
check("...and carries the race's own bonus on it",
	skillNamed(C.assembleCharacter(choices({ racialSkillNames: ["Climb"] }), content, always(10)), "Climb")
		.system.abilityBonus, 10);
// A race's PENALTY on a racial skill: the half-race "better of the two" used to compare against 0
// too, and a Brok's Tame Animal -10% came out as nothing (2026-09-23).
const penaltyContent = { ...content, races: [...content.races, { name: "Grumpfolk", type: "race", system: {
	racialSkills: [{ name: "Climb", bonus: "-10%" }], ages: {}, disabilities: [], abilities: [], endurance: {} } }] };
check("...and a race's penalty on it too, rather than nothing",
	skillNamed(C.assembleCharacter(choices({ raceNames: ["Grumpfolk"], racialSkillNames: ["Climb"] }), penaltyContent, always(10)), "Climb")
		.system.abilityBonus, -10);
check("...and a Half Race still takes the better of the two",
	skillNamed(C.assembleCharacter(choices({ raceNames: ["Grumpfolk", "Testfolk"], racialSkillNames: ["Climb"] }), penaltyContent, always(10)), "Climb")
		.system.abilityBonus, 10);
check("a skill the content does not hold is still created, and reported",
	[!!skillNamed(C.assembleCharacter(choices({ socialSkillNames: ["Nonesuch"] }), content, always(10)), "Nonesuch"),
	 C.assembleCharacter(choices({ socialSkillNames: ["Nonesuch"] }), content, always(10))
		.issues.some(i => i.includes("Nonesuch"))], [true, true]);
check("a language with no name is dropped",
	C.assembleCharacter(choices({ languages: [{ name: "", speak: true, write: false },
	                                          { name: "Trade", speak: true, write: false }] }),
		content, always(10)).actor.system.languages.map(l => l.name), ["Trade"]);
check("every skill's misc is set outright, never left to default to NaN",
	itemsOf(assembled).filter(i => i.type === "skill").every(i => i.system.misc === 0), true);

// --- a starting Endurance that is a die: Gaunt's -1d4 (Epitaph p.7) -----------------------------
// His row carries the live expression [0-getDieRoll(4)] beside the label "-1d4=" (sheet-worker.js
// 34058), rolled whenever the race is applied. Nothing rolled it here, so every Gaunt started at 0.
// It is rolled once now, into the character's own copy of the race: into Start roll, a field of its
// own, with Start mod left as the document has it.
const gauntContent = { ...content, races: [...content.races,
	{ name: "Gaunt", type: "race", system: { racialSkills: [], ages: { startLow: 18, startHigh: 21, maxAge: "100" },
		disabilities: [], abilities: [],
		endurance: { startFormula: "-1d4=", startMod: 0, startRoll: 0, startRolled: false, titleFormula: "1d3" } } }] };
const raceItemOf = (b, n) => itemsOf(b).find(i => i.type === "race" && i.name === n);
const gauntAssembled = C.assembleCharacter(choices({ raceNames: ["Gaunt"] }), gauntContent, always(3));
check("a Gaunt made with a 3 starts at -3 Endurance, on its own copy of the race",
	[raceItemOf(gauntAssembled, "Gaunt").system.endurance.startRoll,
	 raceItemOf(gauntAssembled, "Gaunt").system.endurance.startMod,
	 raceItemOf(gauntAssembled, "Gaunt").system.endurance.startRolled], [-3, 0, true]);
check("...keeping the formula, so the sheet still says where the -3 came from",
	raceItemOf(gauntAssembled, "Gaunt").system.endurance.startFormula, "-1d4=");
check("...and the race document itself is left at 0, unrolled",
	[gauntContent.races[1].system.endurance.startMod, gauntContent.races[1].system.endurance.startRoll,
	 gauntContent.races[1].system.endurance.startRolled], [0, 0, false]);
check("a race with no formula is taken exactly as the document has it",
	raceItemOf(C.assembleCharacter(choices({}), gauntContent, always(3)), "Testfolk").system.endurance,
	{ startMod: 2 });
check("a Gaunt half race rolls its own half and leaves the other alone",
	[raceItemOf(C.assembleCharacter(choices({ raceNames: ["Gaunt", "Testfolk"] }), gauntContent, always(1)), "Gaunt")
		.system.endurance.startRoll,
	 raceItemOf(C.assembleCharacter(choices({ raceNames: ["Gaunt", "Testfolk"] }), gauntContent, always(1)), "Testfolk")
		.system.endurance.startMod], [-1, 2]);

// --- equipBestArmorInPlace: the generator's own Equip Best Armour, docs/sonnet/2026-09-19-equip-buttons.md item 1 ---
// No equipment step to hang a button on, so assembleCharacter calls this once on the items it just
// built (see @MARKER EQUIP BEST ARMOUR in module/chargen-rules.mjs). Tested directly here rather
// than only through assembleCharacter, since the kit tables that feed assembleCharacter's own armour
// are generated data this suite does not control.
const armorItem = (name, coverage, flexibility, extra) => ({ name, type: "armor",
	system: { location: "carried", isShield: false, flexibility, coverage, penalties: {}, ...extra } });
const chainShirt = armorItem("Chain Shirt", { torsoUpper: 6, torsoMid: 6 }, "Semi-Flexible");
const paddedShirt = armorItem("Padded Shirt", { torsoUpper: 2, torsoMid: 2 }, "Clothing");
const dagger = { name: "Dagger", type: "weapon", system: { location: "carried" } };
const equipped = [chainShirt, paddedShirt, dagger];
C.equipBestArmorInPlace(equipped);
check("Equip Best Armour wears the armour it can legally stack",
	equipped.filter(i => i.type === "armor").map(i => i.system.location), ["equipped", "equipped"]);
check("...and leaves the weapon alone, carried -- equip weapons is deliberately not automated",
	dagger.system.location, "carried");
check("...layering the chain shirt outside the padding it needs",
	[paddedShirt.system.layer, chainShirt.system.layer], [0, 1]);

const shield = armorItem("Buckler", { armLeft: 3 }, "Rigid", { isShield: true });
const shieldOnly = [shield];
C.equipBestArmorInPlace(shieldOnly);
check("a shield is left exactly where Equip Best Armour leaves it on the sheet -- untouched",
	shield.system.location, "carried");

check("nothing to wear leaves the list untouched and does not throw",
	(() => { const empty = [dagger]; C.equipBestArmorInPlace(empty); return empty[0].system.location; })(), "carried");

// The generator's own starting-kit assembly runs this for real: nothing equipped beforehand plus
// Equip Best Armour is exactly Take Everything Off's own end state, so a fresh character needs no
// separate "take everything off" call to match the sheet's pair of buttons.
check("a fresh character from assembleCharacter needs no un-equip step: nothing starts equipped without armour",
	itemsOf(assembled).filter(i => i.type === "armor").length, 0);

// --- assembleCharacter carries a Famorian's evokes onto the actor -------------------------------
// The choices' famorian block (breed, animal type, evokesAllowed, evokes, the three rolled
// bonuses) has to land on system.physical.famorian, because that is what ImagineCharacterData
// itself reads back out to rebuild the race every time the actor is opened -- see
// module/data/actor-character.mjs and the 2026-09-22 fix (it was reading identity.famorian,
// which does not exist, so a Famorian's evokes were silently never applied at all).
const famorianAssembled = C.assembleCharacter(choices({
	famorian: { breed: "High Breed", animalType: "Wolf", evokesAllowed: 4,
	           evokes: ["str", "wings"], strBonus: 2, aglBonus: 0, vitBonus: 0 }
}), content, always(10));
check("the famorian block reaches system.physical unchanged",
	famorianAssembled.actor.system.physical.famorian,
	{ breed: "High Breed", animalType: "Wolf", evokesAllowed: 4, evokes: ["str", "wings"],
	  strBonus: 2, aglBonus: 0, vitBonus: 0 });
check("a character with no famorian choices still gets the field, empty",
	assembled.actor.system.physical.famorian,
	{ breed: "", animalType: "", evokesAllowed: 0, evokes: [], strBonus: 0, aglBonus: 0, vitBonus: 0 });

// --- height, frame and weight, against his own tables ------------------------------------------
// His three figures depend on each other: the race gives a height band and a frame type, the band
// gives inches, the frame type and (STR - AGL) give a frame, and the frame with the inches gives a
// weight. Every die below is scripted, so each figure is worked out rather than looked up.
const P = await import("../module/physique-rules.mjs");
const T = await import("../module/physique-tables.mjs");

check("a race knows its height band and its frame type",
	[P.getHeightType("Human(Civilized:Village)"), P.getFrameType("Human(Civilized:Village)")],
	["Average", "Average"]);
check("a Dwarf is Short, a true Giant is a True Giant, a Brownie is Tiny",
	["Dwarf(Mountain)", "Giant(True)", "Brownie"].map(P.getHeightType), ["Short", "True Giant", "Tiny"]);
check("the four races missing from his height switch were filled from their siblings",
	["Giant(Civilized)", "Human(Civilized:City)", "Human(Civilized:Port)", "Human(Civilized:Town)"]
		.map(P.getHeightType), ["Giant", "Average", "Average", "Average"]);

// The Average band is 72 inches at its middle rung: a d100 of 50 lands on "tmpinches=72" with no
// roll at all, which is his 40-59 band.
check("the middle of the Average band is six feet exactly",
	(() => { const h = P.rollHeight("Human(Civilized:Village)", dice(50)); return [h.inches, h.feet, h.inchesPart]; })(),
	[72, 6, 0]);
check("a low roll takes height off the base",
	P.rollHeight("Human(Civilized:Village)", dice(3, 6, 6, 6, 6)).inches, 72 - 24);
check("a high roll adds to it",
	P.rollHeight("Human(Civilized:Village)", dice(99, 6, 6, 6, 6)).inches, 72 + 24);
check("the band's own shortest and tallest come back with it",
	(() => { const h = P.rollHeight("Human(Civilized:Village)", dice(50));
	         return [h.low.feet, h.low.inches, h.high.feet, h.high.inches]; })(), [4, 0, 8, 0]);
check("a race his tables do not know rolls no height at all",
	P.rollHeight("Nonesuch", dice(50)), null);

// His two smallest bands have no d100 ladder at all: the height is one roll. Only two races are
// that small -- a Podling and a Sporeling -- and a Podling's is 3d4 inches.
check("a Miniscule race is a single roll, not a ladder",
	[P.getHeightType("Podling"), P.rollHeight("Podling", always(3)).inches], ["Miniscule1", 9]);

// The frame is STRENGTH MINUS AGILITY down the race's own ladder.
check("a strong, slow character is heavier-framed than a quick one of the same race",
	[P.getFrame("Human(Civilized:Village)", 18, 8).frame,
	 P.getFrame("Human(Civilized:Village)", 8, 18).frame].filter((f, i, a) => a.indexOf(f) === i).length > 1,
	true);
check("the measure his ladder reads is Strength minus Agility",
	P.getFrame("Human(Civilized:Village)", 17, 9).measure, 8);
check("a race with no frame type answers with none, rather than guessing",
	P.getFrame("Nonesuch", 12, 12).frame, "");

// Weight needs both: the frame picks the table, the height picks the band within it.
const midFrame = P.getFrame("Human(Civilized:Village)", 12, 12).frame;
check("a frame and a height give a weight, with the band's own bounds",
	(() => { const w = P.rollWeight(midFrame, 72, always(1));
	         return [typeof w.weight, w.weight > 0, w.low > 0, w.high >= w.low]; })(),
	["number", true, true, true]);
check("a taller character of the same frame weighs more",
	P.rollWeight(midFrame, 78, always(1)).weight >= P.rollWeight(midFrame, 60, always(1)).weight, true);
check("a frame his tables do not hold weighs nothing, and says so by answering null",
	P.rollWeight("Nonesuch", 72, always(1)), null);

// All three together, which is his Apply Height/Frame button.
const physique = P.rollPhysique("Human(Civilized:Village)", 14, 12, dice(50, 1, 1, 1, 1, 1, 1));
check("the whole roll gives a height, a frame and a weight, with nothing left wanting",
	[physique.height.inches, physique.frame !== "", physique.weight.weight > 0, physique.issues],
	[72, true, true, []]);
check("a race with no tables says what it could not do rather than throwing",
	P.rollPhysique("Nonesuch", 14, 12, dice(50)).issues.length, 2);

// A half race averages the two heights and takes the first race's frame.
const halfHeight = P.rollHeight(["Human(Civilized:Village)", "Dwarf(Mountain)"], dice(50, 50));
check("a half race stands between its parents",
	[halfHeight.inches < 72, halfHeight.inches > P.rollHeight("Dwarf(Mountain)", dice(50)).inches],
	[true, true]);
check("...and takes the first race's frame type, as his half race takes its body",
	P.getFrame(["Dwarf(Mountain)", "Human(Civilized:Village)"], 12, 12).type,
	P.getFrameType("Dwarf(Mountain)"));

// The tables themselves, so a regeneration that quietly loses a band is caught.
check("his twelve height bands and six weight frames are all there",
	[Object.keys(T.HEIGHT_BANDS).length, Object.keys(T.WEIGHT_BANDS).length], [12, 6]);
check("the four races his height switch misses were filled, so none is left without a band",
	["Giant(Civilized)", "Human(Civilized:City)", "Human(Civilized:Port)", "Human(Civilized:Town)"]
		.filter(r => !T.HEIGHT_TYPE_BY_RACE[r]), []);

// --- the starting kit: choosing between a band's alternatives ----------------------------------
// module/starting-kit.mjs had no test of its own. rollWildernessKit reads tmpAlternatives[die - 1],
// and a die of 0 -- the fixed die the generator's Review step once used -- read the entry before
// the first and threw, which left the window stuck on Details (2026-09-23).
const K = await import("../module/starting-kit.mjs");
const KT = await import("../module/starting-kit-tables.mjs");
const villageKit = KT.WILDERNESS_KITS[KT.RACE_WILDERNESS_KIT["Human(Civilized:Village)"]]["12"];
const kitNames = (kit) => kit.items.map(i => i.name);
const altNames = (alt) => [...alt.armorClothing, ...alt.weapons, ...alt.generalEquipment].map(s => K.splitItemCount(s).name);
check("a village Human at social 12 has four kits to roll between", villageKit.length, 4);
check("a die inside 1..4 picks that alternative, exactly as before",
	[1, 2, 3, 4].map(n => kitNames(K.rollWildernessKit("Human(Civilized:Village)", 12, always(n)))),
	villageKit.map(altNames));
check("a die of 0 no longer throws; it is held to the first alternative",
	kitNames(K.rollWildernessKit("Human(Civilized:Village)", 12, always(0))), altNames(villageKit[0]));
check("a die past the end is held to the last, not read off the list",
	kitNames(K.rollWildernessKit("Human(Civilized:Village)", 12, always(10))), altNames(villageKit[3]));
check("a die that is not a number is held to the first",
	kitNames(K.rollWildernessKit("Human(Civilized:Village)", 12, always(NaN))), altNames(villageKit[0]));
const kitThrew = [];
for (const race of Object.keys(KT.RACE_WILDERNESS_KIT)) {
	for (let soc = -2; soc <= 25; soc++) {
		for (const face of [0, 1, 10, NaN]) {
			try { K.buildStartingKit({ raceName: race, social: soc, byCulture: true, byStatus: true }, always(face)); }
			catch (e) { kitThrew.push(`${race} soc ${soc} die ${face}: ${e.message}`); }
		}
	}
}
check("no race at any social class throws, whatever the die says", kitThrew.slice(0, 3), []);

// His kit tables are keyed by HIS race names. A split form is looked for under its sourceRace, and
// Brachara under his kit switches' own spelling, "Bracharia" (bug sweep 2026-09-23): before, the eight
// faerie forms and Brachara were given no kit and no clothing at all.
check("a race is found under its own name first (his tables list Maginos(Clay) itself)",
	K.getKitRaceName(KT.RACE_WILDERNESS_KIT, "Maginos(Clay)", "Maginos"), "Maginos(Clay)");
check("...then under its sourceRace (Fairy(Winged) is his Fairy)",
	K.getKitRaceName(KT.RACE_WILDERNESS_KIT, "Fairy(Winged)", "Fairy"), "Fairy");
check("...then under his kit switches' spelling (Brachara is his Bracharia there)",
	[K.getKitRaceName(KT.RACE_WILDERNESS_KIT, "Brachara", ""), K.getKitRaceName(KT.RACE_WARDROBE, "Brachara", "")],
	["Bracharia", "Bracharia"]);
check("a winged Fairy at social 10 gets gear and clothing",
	[K.buildStartingKit({ raceName: "Fairy(Winged)", sourceRace: "Fairy", social: 10, byCulture: true, byStatus: true }, always(1)).items.length > 0,
	 K.buildStartingKit({ raceName: "Fairy(Winged)", sourceRace: "Fairy", social: 10, byCulture: true, byStatus: true }, always(1)).issues],
	[true, []]);
check("a Brachara at social 10 gets them too", K.buildStartingKit({ raceName: "Brachara", social: 10, byCulture: true, byStatus: true },
	always(1)).issues, []);

// A Formless's second race is its host, from formlessHosts; a Half Race's, a fertile partner. The
// generator once kept a second race only if it was a fertile partner, so every host chosen for a
// Formless was wiped on the next change (bug sweep 2026-09-23).
const CV = await import("../module/chargen-view.mjs");
check("getSecondRaceNames: a Formless's hosts, a Half Race's fertile partners",
	[CV.getSecondRaceNames({ system: { formless: true, fertileWith: [], formlessHosts: ["Elf(High)", "Saurian"] } }),
	 CV.getSecondRaceNames({ system: { fertileWith: ["Human(Barbaric)"], formlessHosts: [] } }),
	 CV.getSecondRaceNames(null)],
	[["Elf(High)", "Saurian"], ["Human(Barbaric)"], []]);

// --- the Equipment step: buying at creation (2026-09-23) ------------------------------------------
// The shop's own rules are tested in tools/shop-test.html against the real packs; this is the
// generator's side of it, on the small hand-made content above, so every figure is worked out.
globalThis.foundry = globalThis.foundry ?? {
	abstract: { TypeDataModel: class {} },
	data: { fields: new Proxy({}, { get: () => class { constructor() {} } }) }
};
globalThis.game = globalThis.game ?? { imagine: { getAvailabilityRules: () => null } };
const V = await import("../module/chargen-view.mjs");
check("eight steps now: Equipment between Details and Review",
	V.STEPS, ["Basics", "Race", "Attributes", "Class", "Skills", "Details", "Equipment", "Review"]);

// Three of his panel's names, as documents: a Lantern (10 sp at Medium), a Dagger (7 sp) and a leather
// suit (6 pp), plus his long-bow arrow (3 sp), which is ammunition.
const shopContent = { ...content,
	equipment: [{ name: "Lantern", type: "equipment", system: { weight: 1 } }],
	weapons: [{ name: "Dagger", type: "weapon", system: { weight: 1, type: "Blade", speed: 3 } },
	          { name: "Arrow(Long Bow/Normal)", type: "weapon", system: { weight: 0.25, type: "Missile", speed: 0 } }],
	armor: [{ name: "Armor Suit(Leather)", type: "armor", system: { weight: 14, isShield: false, flexibility: "Mixed",
		coverage: { torsoUpper: 5, torsoMid: 5 }, penalties: {} } }] };
const shopState = () => {
	const s = V.newGeneratorState();
	s.race1 = "Testfolk"; s.className = "Tester";
	s.manual = true; s.manualBase = Object.fromEntries(C.ATTRIBUTE_ORDER.map(k => [k, 12]));
	s.step = V.STEPS.indexOf("Equipment");
	s.startingMoney = { realSocialClass: 12, fortune: 13 };   // rolled already
	s.wealth = { copper: 0, silver: 0, gold: 14, platinum: 0 };
	return s;
};
const sd = (s) => V.deriveGenerator(s, shopContent, () => true);
const shopped = shopState();
shopped.purchases = [{ key: "Weapon|Dagger", count: 2, level: "" }, { key: "Equipment|Lantern", count: 3, level: "" },
	{ key: "Weapon|Arrow(Long Bow/Normal)", count: 20, level: "" }];
const shoppedChoices = V.choicesFromState(shopped, sd(shopped));
check("two daggers (14 sp), three lanterns (30 sp) and twenty arrows (60 sp) out of 14 gp leave 3 gp, 6 sp",
	shoppedChoices.wealth, { copper: 0, silver: 6, gold: 3, platinum: 0 });
check("...and go to assembleCharacter as purchases, one entry per document",
	shoppedChoices.purchases.map(e => [e.docName, e.quantity, e.split]),
	[["Dagger", 2, true], ["Lantern", 3, false], ["Arrow(Long Bow/Normal)", 20, false]]);
const shoppedMade = C.assembleCharacter(shoppedChoices, shopContent, always(1));
check("the character carries two daggers, one stack of three lanterns and one of twenty arrows",
	["Dagger", "Lantern", "Arrow(Long Bow/Normal)"].map(n => itemsOf(shoppedMade).filter(i => i.name == n).map(i => i.system.quantity)),
	[[1, 1], [3], [20]]);
check("...all of it carried, out of the shop", itemsOf(shoppedMade).filter(i => ["equipment", "weapon"].includes(i.type))
	.every(i => i.system.location == "carried"), true);
check("...and starts with what was left", shoppedMade.actor.system.wealth, { copper: 0, silver: 6, gold: 3, platinum: 0 });
check("bought armour is put on at creation, as the kit's is",
	C.assembleCharacter(choices({ purchases: [{ docName: "Armor Suit(Leather)", docType: "armor", quantity: 1, split: true }] }),
		shopContent, always(1)).items.filter(i => i.type == "armor").map(i => i.system.location), ["equipped"]);
check("a purchase whose document has gone is reported, and nothing is made for it",
	(b => [itemsOf(b).some(i => i.name == "Lantern"), b.issues.some(i => i.includes("Lantern"))])(
		C.assembleCharacter(choices({ purchases: [{ docName: "Lantern", docType: "equipment", quantity: 1, split: false, label: "Lantern" }] }),
			content, always(1))), [false, true]);
check("Next goes on from Equipment while the list is paid for", V.checkStep(shopped, sd(shopped)), "");
const tooDear = shopState();
tooDear.purchases = [{ key: "Armor|Armor Suit(Leather)", count: 1, level: "" }];
check("...and waits when it is not: 6 pp is more than 14 gp", V.checkStep(tooDear, sd(tooDear)).includes("can no longer be afforded"), true);
check("a re-rolled purse re-prices the list: with 100 gp the suit is paid for, in changed-up gold",
	(() => { tooDear.wealth.gold = 100; return [V.checkStep(tooDear, sd(tooDear)), V.choicesFromState(tooDear, sd(tooDear)).wealth.gold]; })(),
	["", 40]);
check("the Review lists what was bought and the purse after it",
	(r => [r.money, r.bought])(V.buildGeneratorView({ ...shopped, step: V.STEPS.indexOf("Review") }, shopContent, () => true).review),
	["3 gp, 6 sp", ["Dagger ×2 (14 sp)", "Lantern ×3 (30 sp)", "Arrow(Long Bow/Normal) ×20 (60 sp)"]]);

// --- the kit bands his switch forgot to break (UPSTREAM-ISSUES item 42) -------------------------
// Five of his six kits have no `break` after social 5, and four none after 12-13, so those bands
// fell into the next one and took its kit. His errata (Master's Manual errata p.30, Trolls: "Social
// Class 5: Stone or Obsidian Knife, Club / Social Class 6: Iron Dagger, and Staff") and the books'
// race tables settle it: the extractor repairs the breaks, and says so on every run.
const trollKit = (soc, face) => kitNames(K.rollWildernessKit("Troll", soc, always(face)));
check("a social-5 Troll gets his errata's club and stone or obsidian knife",
	[trollKit(5, 1), trollKit(5, 2)],
	[["Club", "Knife(Stone)", "Waterskin(3-days)"], ["Club", "Knife(Obsidian)", "Waterskin(1-week)"]]);
check("...and social 6 keeps the dagger and staff it always had",
	trollKit(6, 1), ["Dagger", "Quarterstaff", "Waterskin(1-week)"]);
const dwarfKit = (soc) => kitNames(K.rollWildernessKit("Dwarf(Mountain)", soc, always(1)));
check("a social-5 Mountain Dwarf has the book's leather tunic, club and knife (PG p.21)",
	dwarfKit(5), ["Tunic(Leather)", "Club", "Knife(Stone)", "Waterskin(3-days)"]);
check("a social-12 Mountain Dwarf wears a leather suit and no shield, as the book prints 12-13",
	[dwarfKit(12).includes("Armor Suit(Leather)"), dwarfKit(12).some(n => n.startsWith("Shield"))], [true, false]);
check("...while social 14 still has the light chain and shield",
	[dwarfKit(14).includes("Armor Suit(Light Chain)"), dwarfKit(14).some(n => n.startsWith("Shield"))], [true, true]);
check("every repaired band is listed, one per kit and band: 5 in five kits, 12-13 in four",
	KT.WILDERNESS_KIT_REPAIRS.filter(r => r.kind == "band break")
		.map(r => `${r.kit.replace(/^set|WildernessEquipment$/g, "")} ${r.social[0]}`),
	["Giant 5", "Giant 12", "Gnome 5", "Gnome 12", "GoblinForest 5", "GoblinForest 12",
	 "LightChain 5", "LightChain 12", "NoArmorCompressedSocial 5"]);
check("the Standard kit, which always had its band breaks, needed none",
	KT.WILDERNESS_KIT_REPAIRS.filter(r => r.kind == "band break" && r.kit == "setStandardWildernessEquipment").length, 0);
// Its one slip is inside a band: the social 12-13 die roll has no breaks, so his sheet always gives
// the last of its four weapon sets. It has always been read as the choice, which the Player's Guide
// errata p.31 (Saurian) prints; it is now listed rather than silent.
check("...and its breakless 12-13 die roll is listed as read as a choice, still four sets to roll between",
	[KT.WILDERNESS_KIT_REPAIRS.filter(r => r.kind == "die switch").map(r => `${r.kit} ${r.social.join("/")}`),
	 KT.WILDERNESS_KITS.setStandardWildernessEquipment["12"].length],
	[["setStandardWildernessEquipment 12/13"], 4]);

const passed = results.filter(r => r.startsWith("PASS")).length;
const failed = results.length - passed;
document.getElementById("out").innerHTML =
	results.map(r => `<span class="${r.startsWith("PASS") ? "p" : "f"}">${r}</span>`).join("\n")
	+ `\n\n${passed} passed, ${failed} failed`;
</script>
