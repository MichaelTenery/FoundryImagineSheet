<!doctype html>
<meta charset="utf-8">
<title>Imagine RPG combat rules test</title>
<style>body{font:13px monospace;padding:1rem}.p{color:#0a0}.f{color:#c00;font-weight:bold}</style>
<pre id="out">running...</pre>
<script type="module">
// Tests for module/combat/combat-rules.mjs, checked against his tables and code, and against
// the Player's Guide's own worked examples where it gives them.
//
// Must be served over HTTP:
//     python -m http.server 8777 --bind 127.0.0.1
//     open http://127.0.0.1:8777/tools/combat-test.html
const R = await import("../module/combat/combat-rules.mjs");
const T = await import("../module/combat-tables.mjs");
const T_LORE_GENERAL = R.LORE_GENERAL;
const T_LORE_SPECIFIC = R.LORE_SPECIFIC;

const results = [];
function check(label, actual, expected) {
	const ok = JSON.stringify(actual) === JSON.stringify(expected);
	results.push(`${ok ? "PASS" : "FAIL"}  ${label}\n        expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
}
const zone = (skill, natural, mods = 0, extra = {}) => R.resolveAttack({ skill, natural, mods, ...extra }).zone;

// --- the Beginner chart, every natural roll with no modifiers --------------------
// Beginner: 1-2 miss short, 3-5 miss low, 6-8 miss left, 9-11 miss high, 12-14 miss right,
//           15 hit low, 16 left, 17 high, 18 right, 19+ centre. A natural 1 fumbles regardless.
const beginner = [];
for (let n = 1; n <= 20; n++) beginner.push(zone("Beginner", n));
check("Beginner chart, naturals 1-20", beginner, [
	"Fumble", "Miss(Short)", "Miss(Low)", "Miss(Low)", "Miss(Low)",
	"Miss(Left)", "Miss(Left)", "Miss(Left)", "Miss(High)", "Miss(High)",
	"Miss(High)", "Miss(Right)", "Miss(Right)", "Miss(Right)", "Hit(Low)",
	"Hit(Left)", "Hit(High)", "Hit(Right)", "Hit(Center)", "Hit(Center)"]);

// --- modifiers and the floor at 1 ----------------------------------------------
check("modified result is what is read (Novice 10+7 = 17 = centre)", zone("Novice", 10, 7), "Hit(Center)");
check("modifiers can turn a hit into a miss", zone("Beginner", 19, -8), "Miss(High)");
check("result is floored at 1 (Beginner -> miss short)", R.resolveAttack({ skill: "Beginner", natural: 5, mods: -10 }).final, 1);
check("floored Beginner result is Miss(Short)", zone("Beginner", 5, -10), "Miss(Short)");
check("Miss(Short) exists only at Beginner (Novice floor -> Miss(Low))", zone("Novice", 5, -10), "Miss(Low)");
check("Grandmaster centre starts at 6", zone("Grandmaster", 6), "Hit(Center)");
check("Grandmaster 2 is a low hit", zone("Grandmaster", 2), "Hit(Low)");
check("no attack skill at all never hits", R.resolveAttack({ skill: "None", natural: 20, mods: 10 }).isHit, false);

// --- fumbles -------------------------------------------------------------------
check("a natural 1 fumbles even with big bonuses", zone("Master", 1, 15), "Fumble");
check("a fumble forces the result to 1", R.resolveAttack({ skill: "Master", natural: 1, mods: 15 }).final, 1);
check("fumbleMod widens the fumble range", zone("Novice", 2, 0, { fumbleMod: 1 }), "Fumble");
check("a 2 is not a fumble without it", zone("Novice", 2, 0), "Miss(Low)");

// --- called shots: the Player's Guide's own example ----------------------------
// "Brom ... has an Intermediate attack skill. He rolls a 17; normally this would be a 21 with
//  his modifiers. A 17 does not meet the unmodified 18 he needs ... He attacks again, this
//  time rolling a 19 naturally."
const brom1 = R.resolveAttack({ skill: "Intermediate", natural: 17, mods: 4, calledShot: true });
check("Brom's 17 (21 modified) does NOT make the called shot", brom1.isCalledShot, false);
check("...but still hits, since the modified 21 lands", brom1.zone, "Hit(Center)");
check("Brom's natural 19 makes the called shot",
	R.resolveAttack({ skill: "Intermediate", natural: 19, mods: 4, calledShot: true }).isCalledShot, true);
check("called shot needs 21 - level: Beginner 20, Master 15",
	[R.getAttackChart("Beginner").calledShot, R.getAttackChart("Master").calledShot], [20, 15]);
check("an undeclared called shot never counts, even on a 20",
	R.resolveAttack({ skill: "Beginner", natural: 20, mods: 0 }).isCalledShot, false);
check("calledShotMod makes it easier",
	R.resolveAttack({ skill: "Beginner", natural: 19, mods: 0, calledShot: true, calledShotMod: 1 }).isCalledShot, true);

// --- fumble consequences (dice passed in) -----------------------------------------
check("fumble: Agility save made -> lose 1d4+1 seconds",
	R.resolveFumble(70, false, { saveRoll: 40, recoveryRoll: 3, severityRoll: 50, effectRoll: 6 }).secondsLost, 4);
check("fumble: missile jam lasts 1d6+1 seconds",
	R.resolveFumble(70, true, { saveRoll: 90, recoveryRoll: 3, severityRoll: 50, effectRoll: 4 }).secondsLost, 5);
check("fumble: over 80 on severity is critical",
	R.resolveFumble(70, false, { saveRoll: 90, recoveryRoll: 3, severityRoll: 81, effectRoll: 4 }).critical, true);
check("fumble: exactly 80 is still ordinary",
	R.resolveFumble(70, false, { saveRoll: 90, recoveryRoll: 3, severityRoll: 80, effectRoll: 4 }).critical, false);

// --- attack skill from class progression --------------------------------------
const acrobat = "Beginner at 1, Novice at 3, Intermediate at 5, Advanced at 7, Expert at 9, Master at 12";
check("title 1 -> Beginner",      R.getAttackSkillForTitle(acrobat, 1), "Beginner");
check("title 4 -> Novice",        R.getAttackSkillForTitle(acrobat, 4), "Novice");
check("title 5 -> Intermediate",  R.getAttackSkillForTitle(acrobat, 5), "Intermediate");
check("title 15 -> Master",       R.getAttackSkillForTitle(acrobat, 15), "Master");
check("before the first listed title, the first level", R.getAttackSkillForTitle(acrobat, 0), "Beginner");
// His code: "cannot set Grandmaster for standard Attack Chart so just use Master". Grandmaster is
// only for mastered weapons -- the Weapon Lore chart, one step up.
const warriorList = "Novice at 1, Intermediate at 3, Advanced at 5, Expert at 7, Master at 9, Grandmaster(mastered weapons at 9)";
check("the standard chart stops at Master, even where Grandmaster is listed",
	R.getAttackSkillForTitle(warriorList, 12), "Master");
check("...and Weapon Lore, one step up, is Grandmaster", R.getNextAttackSkill(R.getAttackSkillForTitle(warriorList, 12)), "Grandmaster");
check("Warrior title 3 -> Intermediate", R.getAttackSkillForTitle(warriorList, 3), "Intermediate");
check("no progression -> None", R.getAttackSkillForTitle("", 5), "None");
check("Weapon Lore reads one step up", R.getNextAttackSkill("Novice"), "Intermediate");
check("one step above Grandmaster is Grandmaster", R.getNextAttackSkill("Grandmaster"), "Grandmaster");

// every class in the content should resolve to a real chart -- except a non-classed one (GME),
// whose chart is picked by the player rather than read from a progression, so its bare
// "Beginner" is expected not to parse.
const classes = await (await fetch("../src/packs/documents/classes.json")).json();
const unresolved = classes.filter(c => !c.system.nonClassed)
                          .filter(c => c.system.attackSkillList && R.getAttackSkillForTitle(c.system.attackSkillList, 20) === "None")
                          .map(c => `${c.name}: ${c.system.attackSkillList}`);
check("every class's attack progression parses to a real chart", unresolved, []);

// --- to-hit modifiers ------------------------------------------------------------
const sword = { cut: { available: true, mod: 2 }, thrust: { available: true, mod: -2 }, missile: { available: false, mod: 0 }, magicBonus: 1 };
const attacker = { meleeAttack: 2, missileAttack: 1, meleeMisc: 0, missileMisc: 0 };
const hit = R.getToHitModifiers({ mode: "cut", weapon: sword, attacker, target: { defensiveAdjust: -3 }, situational: 0 });
check("melee to-hit: attack type + magic + STR + target defence", hit.total, 2 + 1 + 2 - 3);
check("each modifier is labelled", hit.list.map(m => m.label), ["Attack Type", "Magic", "STR", "Target Defence"]);
check("missile uses AGL, not STR",
	R.getToHitModifiers({ mode: "missile", weapon: { missile: { available: true, mod: 1 } }, attacker, target: null, situational: 0 }).list.map(m => m.label),
	["Attack Type", "AGL"]);

// --- damage ----------------------------------------------------------------------
check("a spear thrown uses its bracketed damage", R.getWeaponDamageDice({ damage: "4d6", damageAlt: "5d6", damageAltMode: "missile" }, "missile"), "5d6");
check("a spear thrust uses its normal damage",   R.getWeaponDamageDice({ damage: "4d6", damageAlt: "5d6", damageAltMode: "missile" }, "thrust"), "4d6");
check("an axe hammer thrusting does 2d6",        R.getWeaponDamageDice({ damage: "5d6", damageAlt: "2d6", damageAltMode: "thrust" }, "thrust"), "2d6");
check("STR damage one-handed",                   R.getStrengthDamageMod(4, "cut", false), 4);
check("STR damage two-handed doubles a bonus",   R.getStrengthDamageMod(4, "cut", true), 8);
check("STR damage two-handed HALVES a penalty",  R.getStrengthDamageMod(-3, "cut", true), -1);
check("no STR damage for projectiles",           R.getStrengthDamageMod(6, "missile", true), 0);
check("multipliers combine",                     R.combineDamageMultipliers([2, 1.5]), 3);
check("multipliers never exceed x3",             R.combineDamageMultipliers([2, 2, 2]), 3);
check("called shot halves damage",               R.combineDamageMultipliers([0.5]), 0.5);

// --- armour blocking, against his table ------------------------------------------
// Cutting [0, 0, 0.25, -0.5]; armour 20 -> quarter 5, half 10.
check("cutting under a quarter of the armour: stopped", R.blockDamage(5, "Cutting", 20), 0);
check("cutting quarter-to-half: stopped",              R.blockDamage(8, "Cutting", 20), 0);
check("cutting half-to-full: 25% through (15 -> 3)",   R.blockDamage(15, "Cutting", 20), 3);
check("exactly equal to the armour is half-to-full",   R.blockDamage(20, "Cutting", 20), 5);
check("cutting over the armour: loses half of it (30 -> 20)", R.blockDamage(30, "Cutting", 20), 20);
check("crushing quarter-to-half: loses a quarter of the armour (8 -> 3)", R.blockDamage(8, "Crushing", 20), 3);
check("flame loses the full armour value (30 -> 10)", R.blockDamage(30, "Flame", 20), 10);
check("flame under the armour: stopped",               R.blockDamage(15, "Flame", 20), 0);
check("no armour: cutting passes in full",             R.blockDamage(12, "Cutting", 0), 12);
check("bypass: armour ignored",                        R.blockDamage(12, "Cutting", 40, true), 12);
check("unknown damage type is treated as Other",       R.blockDamage(30, "Wibble", 20), 10);
// His table gives Poison [0,0,0,0], which by his own code means no damage even with no armour.
// Recorded as-is and raised with him (UPSTREAM-ISSUES) -- probably meant to be applied with bypass.
check("poison without bypass does nothing (his table, flagged)", R.blockDamage(12, "Poison", 0), 0);
check("poison with bypass lands in full",              R.blockDamage(12, "Poison", 0, true), 12);

// --- his critical fumble table ---------------------------------------------------
// getCriticalFumble (sheet-worker.js:26460): nine ten-point bands, then tripping, tripping with
// damage, and at 99 and 100 losing the weapon too. The dice are passed in, as everywhere here.
const critDice = (roll, extra = {}) => ({
	criticalRoll: roll, variantRoll: 50, standRoll: 3, throwRoll: 12, directionRoll: 3,
	stunRoll: 2, ...extra
});
const crit = (roll, extra) => R.resolveCriticalFumble(false, critDice(roll, extra));

check("1-10: solid object, half damage",   [crit(5).target, crit(5).damageMultiplier], ["object", 0.5]);
check("11-20: solid object, full",         [crit(15).target, crit(15).damageMultiplier], ["object", 1.0]);
check("21-30: solid object, double",       [crit(25).target, crit(25).damageMultiplier], ["object", 2.0]);
check("31-40: another target, half",       [crit(35).target, crit(35).damageMultiplier], ["other", 0.5]);
check("51-60: another target, double",     [crit(55).target, crit(55).damageMultiplier], ["other", 2.0]);
check("61-70: hits self, half",            [crit(65).target, crit(65).damageMultiplier], ["self", 0.5]);
check("81-90: hits self, double",          [crit(85).target, crit(85).damageMultiplier], ["self", 2.0]);
check("the band edges land in the lower band", [crit(10).damageMultiplier, crit(11).damageMultiplier], [0.5, 1.0]);

// 91-94 is a trip with no damage; 1d6+1 seconds to stand.
check("91-94: trips, no damage",           crit(92).damageMultiplier, 0);
check("...and loses 1d6+1 seconds",        crit(92).secondsLost, 4);
check("95-98: trips and takes full damage", [crit(96).target, crit(96).damageMultiplier], ["self", 1.0]);
check("...still only 1d6+1 seconds",       crit(96).secondsLost, 4);

// The last two bands roll again: under 20 the damage lands normally, otherwise through armour.
check("99: the weapon is lost",            crit(99).weaponLost, true);
check("99 with a low variant roll: armour still counts",
	crit(99, { variantRoll: 10 }).bypassesArmor, false);
check("99 with a high variant roll: bypasses armour",
	crit(99, { variantRoll: 50 }).bypassesArmor, true);
check("100: double damage and stunned",    [crit(100).damageMultiplier, crit(100).weaponLost], [2.0, true]);
check("100 adds the stun to the time to stand", crit(100).secondsLost, 6);   // 1d3=2 plus 1d6+1=4
check("the thrown weapon takes a direction", crit(99).text.includes("East"), true);

// A missile critical is always the same.
const critMissile = R.resolveCriticalFumble(true, critDice(5));
check("a missile critical breaks the weapon", critMissile.weaponBroken, true);
check("...and does no damage",                critMissile.damageMultiplier, 0);

// And it reaches through resolveFumble, which is what the attack code calls.
const fullFumble = R.resolveFumble(30, false, {
	saveRoll: 90, recoveryRoll: 3, severityRoll: 95, ...critDice(65)
});
check("a failed save above 80 is critical",   fullFumble.critical, true);
check("...and carries the table's consequence", fullFumble.damageMultiplier, 0.5);
check("...with the table's text",             fullFumble.text.includes("Hits self"), true);

// --- which armour slot covers which area, per body type --------------------------
// From getArmorValuesByBodyTypeAndArmor. His version switches on the area's POSITION in the
// body chart; the port keys by area NAME, because two of his branches have drifted out of step
// with the charts they serve (docs/UPSTREAM-ISSUES.md items 17 and 18).
check("a Humanoid's head takes the head slot",   R.getAreaArmorSlot("Humanoid", "Head").slot, "head");
check("a Humanoid's mid torso is not the upper", R.getAreaArmorSlot("Humanoid", "Mid Torso").slot, "torsoMid");
check("an arm takes the arm slot, not a torso",  R.getAreaArmorSlot("Humanoid", "Left Arm").slot, "armLeft");

// A family matches by substring, as his includes() does, so every variant is served.
check("Humanoid variants share the family",      R.getArmorFamily("Humanoid(Wings/Tail)"), "Humanoid");
check("Saurian is its own family",               R.getArmorFamily("Saurian"), "Saurian");
check("Snake(Arms) resolves to Snake",           R.getArmorFamily("Snake(Arms)"), "Snake");

// The twenty-three body types he wrote no branch for take nothing from worn armour -- in his
// sheet as in this port. A bird in a breastplate is still an unarmoured bird.
check("a Bird has no armour family",             R.getArmorFamily("Bird"), "");
check("...so no slot covers its torso",          R.getAreaArmorSlot("Bird", "Upper Torso").slot, "");
check("a Quadruped likewise",                    R.getArmorFamily("Quadruped(Tail)"), "");

// Where his positional map has slipped, the name-keyed port puts the armour where his own
// comments say it belongs. Positionally, Snake(Arms) would give a shoulder the LOWER TORSO
// value and a Centaur's Left Hand the MID TORSO value.
check("Snake(Arms) shoulder takes a shoulder slot", R.getAreaArmorSlot("Snake(Arms)", "Left Shoulder").slot, "shoulderLeft");
check("Snake's length takes a torso slot",          R.getAreaArmorSlot("Snake", "Lower Length").slot, "torsoLower");
check("a Centaur's hand takes a hand slot",         R.getAreaArmorSlot("Centaur", "Left Hand").slot, "handLeft");
check("a Centaur's upper torso is unshifted",       R.getAreaArmorSlot("Centaur", "Upper Torso").slot, "torsoUpper");

// Barding: a centaur's quarters and legs take armour only from an item named for it.
check("forequarters need barding",  R.getAreaArmorSlot("Centaur", "Forequarters").requiresItem, "Centaur Barding");
check("a centaur's head does not",  R.getAreaArmorSlot("Centaur", "Head").requiresItem, "");
check("an arachen's abdomen needs its own barding",
	R.getAreaArmorSlot("Arachen", "Abdomen").requiresItem, "Insectaur Barding");

// Where a chart spells an area differently from the comment on the case that serves it, the
// chart's own spelling is matched to the same slot. Without this, keying by name loses the
// area's armour altogether -- these eight body charts had areas that no worn armour reached.
check("a hooved Humanoid's hoof IS its foot",       R.getAreaArmorSlot("Humanoid(Hooves)", "Left Hoof").slot, "footLeft");
check("...and a plain Humanoid's foot still is",    R.getAreaArmorSlot("Humanoid", "Left Foot").slot, "footLeft");
check("an Insectoid's lower leg is his shin",       R.getAreaArmorSlot("Insectoid", "Left Lower Leg").slot, "shinLeft");
check("an Insectoid's mid claw/hand is his claw",   R.getAreaArmorSlot("Insectoid(Wings)", "Right Mid Claw/Hand").slot, "handRight");
check("a merfolk's finned tail takes the thigh",    R.getAreaArmorSlot("Humanoid(Fish Tail)", "Finned Tail").slot, "thighLeft");

// Matching a spelling must not invent coverage his branch does not give. A Centaur's fore shin
// is spelled "Foreshin" in his comment and "Fore Shin" in his chart, and neither has a slot.
check("a Centaur's fore shin is still unarmoured",  R.getAreaArmorSlot("Centaur", "Left Fore Shin").slot, "");
check("...and its foreleg still needs barding",     R.getAreaArmorSlot("Centaur", "Left Foreleg").requiresItem, "Centaur Barding");

// The dead key his Centaur branch had -- a Mid Torso no Centaur chart contains -- is gone.
check("no Centaur area claims a mid torso",         R.getAreaArmorSlot("Centaur", "Mid Torso").slot, "");

// --- totalling the armour worn over one area -------------------------------------
const mail = { name: "Body Suit(Chain)", system: { material: "Chain", coverage: { torsoUpper: 6, head: 0, thighLeft: 4 } } };
const cap  = { name: "Cap(Leather)",     system: { material: "Leather", coverage: { head: 2 } } };
const barding = { name: "Centaur Barding(Plate)", system: { material: "Plate", coverage: { torsoLower: 8 } } };

check("layers over one area add up",
	R.getAreaArmor("Humanoid", "Upper Torso", [mail, cap]).armor, 6);
check("a layer that does not cover the area adds nothing",
	R.getAreaArmor("Humanoid", "Head", [mail, cap]).armor, 2);
check("the covering layers are named",
	R.getAreaArmor("Humanoid", "Head", [mail, cap]).layers, ["Cap(Leather)"]);
check("an unarmoured body type gets nothing however much is worn",
	R.getAreaArmor("Bird", "Upper Torso", [mail, cap]).armor, 0);

// A gated area ignores everything but the named kind, whatever else is worn over it.
check("barding covers the forequarters",
	R.getAreaArmor("Centaur", "Forequarters", [barding]).armor, 8);
check("ordinary armour does not, even where the slot matches",
	R.getAreaArmor("Centaur", "Forequarters", [{ name: "Body Suit(Chain)", system: { material: "Chain", coverage: { torsoLower: 9 } } }]).armor, 0);
check("and the ungated areas are unaffected by the gate",
	R.getAreaArmor("Centaur", "Upper Torso", [mail]).armor, 6);

// --- pain threshold ---------------------------------------------------------------
// From handleBodyDamage. A SIGNED modifier on incoming damage, applied before armour and before
// anything magical takes its share. The note beside it on his own sheet reads "reduces or adds
// to all incoming damage (-/+)", so a negative number is a tougher target.
check("no threshold leaves a blow alone",     R.applyPainThreshold(10, 0, false), 10);
check("a negative threshold softens it",      R.applyPainThreshold(10, -3, false), 7);
check("a positive threshold sharpens it",     R.applyPainThreshold(10, 4, false), 14);
check("the Famorian evoke takes one more",    R.applyPainThreshold(10, -3, true), 6);
check("...and works on its own",              R.applyPainThreshold(10, 0, true), 9);
check("a missing threshold reads as none",    R.applyPainThreshold(10, undefined, false), 10);

// Not floored here: his floors further down the pipeline, after the magical pre-reductions,
// and resolveAreaDamage is where that happens.
check("the result can go negative",           R.applyPainThreshold(2, -5, false), -3);
check("...and resolveAreaDamage floors it",
	R.resolveAreaDamage({ damage: -3, type: "Cutting", totalArmor: 0, bypass: false, hide: 0 }).net, 0);

// Whether a blow does anything at all is read off the RAW figure, before the threshold. His
// whole apply block -- armour damage, hide, absorption and the store alike -- sits inside
// `if (!isLost && !noDamageInput)`, so a hit that rolled under 1 does nothing whatever, however
// large a positive pain threshold the target carries.
check("a blow of 1 lands",              R.blowLands(1, false), true);
check("a blow of 0 does not",           R.blowLands(0, false), false);
check("nor does a negative one",        R.blowLands(-4, false), false);
check("a lost area cannot be hurt",     R.blowLands(10, true), false);

// With damage actually entered, armour blocks normally and the threshold only changes the
// figure it is blocking. 20 armour against 10 cutting is the under-quarter band.
const entered = R.resolveAreaDamage({
	damage: R.applyPainThreshold(10, 0, false), type: "Cutting", totalArmor: 20,
	bypass: false, hide: 0, material: "Plate" });
const softened = R.resolveAreaDamage({
	damage: R.applyPainThreshold(10, -4, false), type: "Cutting", totalArmor: 20,
	bypass: false, hide: 0, material: "Plate" });
check("a softened blow gets no further through than the full one", softened.net <= entered.net, true);
check("blocking runs on the felt figure", entered.net, R.blockDamage(10, "Cutting", 20, false));

// --- weapon and missile lore, per weapon ------------------------------------------
// From setCombatModifierValues (sheet-worker.js:82558) and the weapon-speed path. A character
// who has the lore gets a flat set of figures for every weapon of that kind, and a LARGER set
// INSTEAD for a weapon named in the matching list -- his own comment on the speed says so:
// "only give a -1 more, -1 is already accounted for in the general mod", making a lored weapon
// -2 in total rather than -3.
check("the general figures",  T_LORE_GENERAL, { attack: 2, damage: 4, speed: -1, skills: 10 });
check("the specific figures", T_LORE_SPECIFIC, { attack: 3, damage: 6, speed: -2, skills: 20 });

// Whether the lore is held at all: a class carries the title, zero meaning it never gets it.
// The test follows the ONE gate he wrote correctly, which for whole titles is `title >= when`.
check("below the title, no lore",       R.hasLore(5, 7), false);
check("at the title, lore",             R.hasLore(7, 7), true);
check("above it, lore",                 R.hasLore(12, 7), true);
check("zero means this class never does", R.hasLore(20, 0), false);
check("...even at a very high title",   R.hasLore(99, 0), false);

// His lists hold SIMPLIFIED names: a customised item is written "...{Base Name}...".
check("a plain name is already simple", R.getSimplifiedName("Bastard Sword"), "Bastard Sword");
check("a customised one is stripped",   R.getSimplifiedName("Fine {Bastard Sword} of Ice"), "Bastard Sword");
check("empty stays empty",              R.getSimplifiedName(""), "");
check("undefined reads as empty",       R.getSimplifiedName(undefined), "");

check("a list is split and trimmed",    R.parseLoreList("Bastard Sword, Dagger"), ["Bastard Sword", "Dagger"]);
check("blanks and trailing commas drop", R.parseLoreList("Bastard Sword, , Dagger,"), ["Bastard Sword", "Dagger"]);
check("an empty list is empty",         R.parseLoreList(""), []);
check("an array passes through",        R.parseLoreList(["Dagger"]), ["Dagger"]);

check("a weapon in the list is lored",  R.isWeaponLored("Bastard Sword", ["Bastard Sword"]), true);
check("a customised one still matches", R.isWeaponLored("Fine {Bastard Sword} of Ice", ["Bastard Sword"]), true);
check("one not in the list is not",     R.isWeaponLored("Dagger", ["Bastard Sword"]), false);

// What an attack actually gets. Melee reads Weapon Lore, missile reads Missile Lore, and
// neither touches the other.
const lore = (o) => R.getLoreModifiers({ weaponName: "Bastard Sword", ...o });
check("no lore, nothing",
	lore({ mode: "cut" }), { attack: 0, damage: 0, speed: 0, skills: 0, specific: false });
check("weapon lore, a weapon not singled out",
	lore({ mode: "cut", hasWeaponLore: true, weaponLoreList: "Dagger" }),
	{ attack: 2, damage: 4, speed: -1, skills: 10, specific: false });
check("weapon lore, a weapon singled out",
	lore({ mode: "cut", hasWeaponLore: true, weaponLoreList: "Bastard Sword" }),
	{ attack: 3, damage: 6, speed: -2, skills: 20, specific: true });
check("all three melee modes read weapon lore",
	["thrust", "cut", "smash"].map(m => lore({ mode: m, hasWeaponLore: true }).attack), [2, 2, 2]);
check("missile does not read weapon lore",
	lore({ mode: "missile", hasWeaponLore: true, weaponLoreList: "Bastard Sword" }).attack, 0);
check("missile lore covers missile",
	lore({ mode: "missile", hasMissileLore: true }).attack, 2);
check("...and a lored missile gets the larger set",

// From handleBodyDamage, the very last thing to touch the damage -- after armour has blocked
// its share and after natural hide. A POOL, not a per-blow reduction: it takes what it can and
// is spent by the same amount, so it wears out.
check("no pool changes nothing",        R.absorbDamage(10, 0), { damage: 10, pool: 0 });
check("a pool bigger than the blow eats it whole",  R.absorbDamage(4, 10), { damage: 0, pool: 6 });

check("a pool against no damage is untouched",      R.absorbDamage(0, 5),  { damage: 0, pool: 5 });

// It wears out across blows, which is the whole point of it being a pool.
var tmppool = 10;
var tmpthrough = [];
for (const tmpblow of [3, 3, 3, 3]) {
	const tmpstep = R.absorbDamage(tmpblow, tmppool);
	tmppool = tmpstep.pool;
	tmpthrough.push(tmpstep.damage);
}
check("a pool of 10 against four blows of 3", tmpthrough, [0, 0, 0, 2]);
check("...and is empty afterwards",           tmppool, 0);

// The skill's own worked example claims "at 50% skill chance the practitioner could have no
// penalties to hit or damage when firing two arrows at once" -- which its own rule does not give:
// two levels off -4/-6 leaves -2/-2, and only 100% clears it. His sheet implements the rule, so
// this pins the rule and the contradiction is written up in UPSTREAM-ISSUES.md item 29.
check("50% buys two levels, which does NOT clear it -- the book's example is wrong",
	R.resolveMultiMissile(mmInput({ knowChance: 50, knowList: "Bow(Long)/Arrow(Long Bow/Normal)" })),
	{ attack: -2, damage: -2, shots: 2, repeats: true, tier: "knowledge", levels: 2 });
check("100% floors both at zero and never past it",
	R.resolveMultiMissile(mmInput({ knowChance: 100, knowList: "Bow(Long)/Arrow(Long Bow/Normal)" })),
	{ attack: 0, damage: 0, shots: 2, repeats: true, tier: "knowledge", levels: 4 });
check("three projectiles take longer to buy down than two",
	R.resolveMultiMissile(mmInput({ mode: "threeProjectiles", knowChance: 50,
		knowList: "Bow(Long)/Arrow(Long Bow/Normal)" })),
	{ attack: -6, damage: -8, shots: 3, repeats: true, tier: "knowledge", levels: 2 });
// Learned per combination: a high skill on a combination never learned pays full anyway.
check("a combination never learned pays full however high the skill",
	R.resolveMultiMissile(mmInput({ knowChance: 100, knowList: "Thrown/Dagger" })),
	{ attack: -4, damage: -6, shots: 2, repeats: true, tier: "full", levels: 0 });

// --- acquiring a combination (handleRollMultiMissileKnow/Lore, sheet-worker.js:88805/88950) ----
check("a dagger is thrown, not launched", R.isThrownWeapon("Dagger"), true);
check("an arrow is not thrown", R.isThrownWeapon("Arrow(Long Bow/Normal)"), false);
check("a Long Bow's arrow reads back to the Long Bow",
	R.getLaunchersForProjectile("Arrow(Long Bow/Normal)"), ["Bow(Long)"]);
check("an arrowhead variant simplifies the same way as its Normal",
	R.getLaunchersForProjectile("Arrow(Long Bow/Broadhead)"), ["Bow(Long)"]);
check("a crossbow bolt reads back to all four crossbow variants",
	R.getLaunchersForProjectile("Bolt(Crossbow/Normal)"),
	["Crossbow", "Crossbow(Double)", "Crossbow(Over-Under)", "Crossbow(Repeating)"]);
check("an unrecognised missile reads back to no launcher at all",
	R.getLaunchersForProjectile("Nonsense"), []);

check("a dagger only combos with Thrown", R.isValidMissileCombo("Thrown", "Dagger"), true);
check("a dagger does not combo with a bow", R.isValidMissileCombo("Bow(Long)", "Dagger"), false);
check("a Long Bow combos with its own arrow",
	R.isValidMissileCombo("Bow(Long)", "Arrow(Long Bow/Normal)"), true);
check("a Long Bow does not combo with a Composite Bow's arrow",
	R.isValidMissileCombo("Bow(Long)", "Arrow(Composite Bow/Normal)"), false);
check("entering the launcher alone still matches, his third branch",
	R.isValidMissileCombo("Crossbow(Hand)", "Bolt(Hand Crossbow/Normal)"), true);

// His early-exit order: no launcher, already known, no missile, mismatch, no chance, then the
// roll itself.
check("no launcher does nothing",
	R.resolveMissileComboAcquisition({ launcher: "", missile: "Arrow(Long Bow/Normal)", chance: 50, roll: 10 }).outcome,
	"noLauncher");
check("a combo already on the list does nothing",
	R.resolveMissileComboAcquisition({ launcher: "Bow(Long)", missile: "Arrow(Long Bow/Normal)",
		chance: 50, roll: 10, list: "Bow(Long)/Arrow(Long Bow/Normal)" }).outcome,
	"alreadyKnown");
check("no missile does nothing",
	R.resolveMissileComboAcquisition({ launcher: "Bow(Long)", missile: "", chance: 50, roll: 10 }).outcome,
	"noMissile");
check("a launcher and missile that do not go together does nothing",
	R.resolveMissileComboAcquisition({ launcher: "Bow(Long)", missile: "Dagger", chance: 50, roll: 10 }).outcome,
	"invalidCombo");
check("no chance in the skill does nothing even if everything else is right",
	R.resolveMissileComboAcquisition({ launcher: "Bow(Long)", missile: "Arrow(Long Bow/Normal)",
		chance: 0, roll: 1 }).outcome,
	"noChance");
check("rolling over the chance fails and leaves the list alone", (() => {
	var tmpresult = R.resolveMissileComboAcquisition({ launcher: "Bow(Long)",
		missile: "Arrow(Long Bow/Normal)", chance: 40, roll: 41, list: "Thrown/Dagger" });
	return [tmpresult.outcome, tmpresult.list];
})(), ["failed", "Thrown/Dagger"]);
check("rolling at or under the chance succeeds and appends to the list", (() => {
	var tmpresult = R.resolveMissileComboAcquisition({ launcher: "Bow(Long)",
		missile: "Arrow(Long Bow/Normal)", chance: 40, roll: 40, list: "Thrown/Dagger" });
	return [tmpresult.outcome, tmpresult.list];
})(), ["succeeded", "Thrown/Dagger,Bow(Long)/Arrow(Long Bow/Normal)"]);
check("succeeding from an empty list does not leave a stray leading comma", (() => {
	var tmpresult = R.resolveMissileComboAcquisition({ launcher: "Thrown", missile: "Dagger",
		chance: 40, roll: 1, list: "" });
	return tmpresult.list;
})(), "Thrown/Dagger");

// --- the better of two attack charts ------------------------------------------------
// Player's Guide, Dual Class, Experience and Advancement rule 5: "Attack skill is determined by
// the greater of the two values". Better is further along the chart order, not a bigger number.
check("the later chart wins",            R.getBetterAttackSkill("Novice", "Expert"), "Expert");
check("...whichever side it is given on", R.getBetterAttackSkill("Expert", "Novice"), "Expert");
check("two of the same is that one",     R.getBetterAttackSkill("Master", "Master"), "Master");
check("anything beats None",             R.getBetterAttackSkill("None", "Beginner"), "Beginner");
check("...and None beats nothing",       R.getBetterAttackSkill("Beginner", "None"), "Beginner");
check("an unknown name loses to a real chart",
	R.getBetterAttackSkill("Nonsense", "Novice"), "Novice");
check("two unknowns come back as the first, rather than erroring",
	R.getBetterAttackSkill("Nonsense", "Gibberish"), "Nonsense");

// --- encumbrance, against his calcEncumbrance (sheet-worker.js:81745) -------------------
// Size scaling of armour and gear. Six to seven feet is his standard, with no adjustment.
check("6'0\" to 6'11\" is the standard, x1",       R.getSizeWeightMultiplier(72, 215), 1);
check("...right up to 6'11\"",                     R.getSizeWeightMultiplier(83, 215), 1);
check("5'9\" at 215 lb carries gear at x.9",       R.getSizeWeightMultiplier(69, 215), 0.9);
check("5'9\" at 149 lb is x.8",                    R.getSizeWeightMultiplier(69, 149), 0.8);
check("5'9\" at 100 lb is x.7",                    R.getSizeWeightMultiplier(69, 100), 0.7);
check("a 3'6\" halfling at 70 lb is x.4",          R.getSizeWeightMultiplier(42, 70), 0.4);
check("under a foot and under 21 lb is x.005",     R.getSizeWeightMultiplier(8, 5), 0.005);
check("...and his unreachable <20 branch is not invented: 25 lb is x.01",
	R.getSizeWeightMultiplier(8, 25), 0.01);
check("7'6\" at 400 lb is x1.2",                   R.getSizeWeightMultiplier(90, 400), 1.2);
check("eleven feet and over goes by weight alone", R.getSizeWeightMultiplier(200, 5000), 4);
check("...up to x10 past 40,000 lb",               R.getSizeWeightMultiplier(400, 50000), 10);
check("height not entered takes no adjustment",    R.getSizeWeightMultiplier(0, 215), 1);

check("+1 weighs x.9",   R.getMagicWeightMultiplier(1), 0.9);
check("+5 weighs x.5",   R.getMagicWeightMultiplier(5), 0.5);
check("+10 weighs x.05", R.getMagicWeightMultiplier(10), 0.05);
check("no plus weighs as normal", R.getMagicWeightMultiplier(0), 1);
check("a plus with no case in his switch weighs as normal", R.getMagicWeightMultiplier(12), 1);

// --- quality tags (getItemWeight, sheet-worker.js:81979-81990) -----------------------
check("[Shoddy] weighs x1.75", R.getQualityWeightMultiplier("Shoddy"), 1.75);
check("[Poor] weighs x1.1",    R.getQualityWeightMultiplier("Poor"), 1.1);
check("[Good] weighs x.9",     R.getQualityWeightMultiplier("Good"), 0.9);
check("[High] weighs x.8",     R.getQualityWeightMultiplier("High"), 0.8);
check("[Master] weighs x.75",  R.getQualityWeightMultiplier("Master"), 0.75);
check("blank (average) weighs as normal", R.getQualityWeightMultiplier(""), 1);
check("unset weighs as normal",           R.getQualityWeightMultiplier(undefined), 1);
check("an unrecognised tag weighs as normal", R.getQualityWeightMultiplier("Legendary"), 1);

// His labels, and the book's speed for each band. Bands for a 400 lb load limit: 100/200/300/400.
const bands = { none: 100, slight: 200, moderate: 300, heavy: 400 };
check("his five labels, in order",
	[0, 150, 250, 350, 450].map(w => R.getEncumbranceBand(w, bands).status),
	["Not encumbered", "Slightly encumbered", "Encumbered", "Heavily encumbered", "Over weight(cannot move)"]);
check("exactly on a band's figure is still inside it",
	R.getEncumbranceBand(100, bands).status, "Not encumbered");
check("the book's speed factors: 1, 3/4, 1/2, 1/4, none",
	[0, 150, 250, 350, 450].map(w => R.getEncumbranceBand(w, bands).speedFactor), [1, 0.75, 0.5, 0.25, 0]);
check("heavily encumbered cannot run", R.getEncumbranceBand(350, bands).canRun, false);
check("encumbered still can",          R.getEncumbranceBand(250, bands).canRun, true);

// The Player's Guide's own worked example: Strength 17 (load limit 1.6), 250 lb, so 400 lb.
const item = (type, weight, extra = {}) => ({ type, system: { weight, quantity: 1, location: "carried", ...extra } });
const ex = R.resolveEncumbrance([], 1.6, 250, 72);
check("the book's warrior: bands at 100/200/300/400",
	[ex.none, ex.slight, ex.moderate, ex.heavy], [100, 200, 300, 400]);
check("armour and gear are scaled by size, weapons are not",
	R.resolveEncumbrance([item("armor", 100), item("equipment", 50), item("weapon", 10)], 1.6, 215, 69).carried,
	(150 * 0.9) + 10);
check("a magical plus lightens the item itself",
	R.resolveEncumbrance([item("armor", 100, { magicBonus: 2 })], 1.6, 250, 72).carried, 80);
check("...and a magic weapon too",
	R.resolveEncumbrance([item("weapon", 10, { magicBonus: 5 })], 1.6, 250, 72).carried, 5);
check("the size multiplier is reported",
	R.resolveEncumbrance([], 1.6, 215, 69).sizeMultiplier, 0.9);

// A quality tag scales a non-magical item's weight; a magical plus replaces it rather than
// stacking (his getItemWeight only reads quality "if not magical").
check("[Shoddy] gear weighs more",
	R.resolveEncumbrance([item("equipment", 40, { quality: "Shoddy" })], 1.6, 250, 72).carried,
	40 * 1.75);
check("[Master] gear weighs less",
	R.resolveEncumbrance([item("weapon", 10, { quality: "Master" })], 1.6, 250, 72).carried,
	10 * 0.75);
check("blank quality weighs as normal",
	R.resolveEncumbrance([item("armor", 20, { quality: "" })], 1.6, 250, 72).carried, 20);
check("a magical plus overrides quality rather than stacking with it",
	R.resolveEncumbrance([item("armor", 100, { magicBonus: 2, quality: "Shoddy" })], 1.6, 250, 72).carried,
	80);

const move = { walk: { hourly: 3, tenSec: 40, oneSec: 4 }, jog: { hourly: 6, tenSec: 80, oneSec: 8 },
               run: { hourly: 12, tenSec: 160, oneSec: 16 } };
const slowed = R.resolveLoadedMovement(move, { speedFactor: 0.5, canRun: true });
check("encumbered halves every rate", [slowed.walk.tenSec, slowed.jog.hourly, slowed.run.oneSec], [20, 3, 8]);
const heavy = R.resolveLoadedMovement(move, { speedFactor: 0.25, canRun: false });
check("heavily encumbered walks at a quarter", heavy.walk.tenSec, 10);
check("...and cannot run at all", [heavy.run.hourly, heavy.run.tenSec, heavy.run.oneSec], [0, 0, 0]);
check("...though it can still jog", heavy.jog.tenSec, 20);
check("slightly encumbered keeps a decimal rather than truncating",
	R.resolveLoadedMovement(move, { speedFactor: 0.75, canRun: true }).walk.hourly, 2.3);

// --- his "[Float]" marker ----------------------------------------------------------------------
// A thing that weighs nothing to carry. His own sheet reads it out of the item's NAME, so a player
// marks a raft by typing it there; the field is the tidier way to say the same thing.
const floatItem = (name, sys) => ({ name, type: "equipment",
	system: Object.assign({ weight: 40, quantity: 1, location: "carried" }, sys) });
check("an item named [Float] is not carried weight",
	R.itemFloats(floatItem("Log Raft [Float]", {})), true);
check("...whatever the case", R.itemFloats(floatItem("Air Bladder [FLOAT]", {})), true);
check("...and the field says it too", R.itemFloats(floatItem("Raft", { floats: true })), true);
check("an ordinary item does not float", R.itemFloats(floatItem("Iron Bar", {})), false);
check("a floating item adds nothing to what is carried",
	R.resolveEncumbrance([floatItem("Log Raft [Float]", {}), floatItem("Iron Bar", {})], 5, 180, 70).carried,
	R.resolveEncumbrance([floatItem("Iron Bar", {})], 5, 180, 70).carried);

const passed = results.filter(r => r.startsWith("PASS")).length;
document.getElementById("out").innerHTML =
	results.map(r => `<span class="${r.startsWith("PASS") ? "p" : "f"}">${r}</span>`).join("\n")
	+ `\n\n${passed} passed, ${results.length - passed} failed`;
</script>
